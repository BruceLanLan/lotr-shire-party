<script type="module">
import * as THREE from 'three';

// ===========================================================================
// small utilities
// ===========================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const frac = (v) => v - Math.floor(v);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(111);
const rr = (a, b) => a + rng() * (b - a);
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

// piecewise-linear schedule sampler: stops = [[t, value], ...]
function schedule(stops) {
  return (t) => {
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, v0] = stops[i - 1], [t1, v1] = stops[i];
        return lerp(v0, v1, (t - t0) / (t1 - t0));
      }
    }
    return stops[stops.length - 1][1];
  };
}
function colorSchedule(stops) {
  const cs = stops.map(([t, c]) => [t, new THREE.Color(c)]);
  const out = new THREE.Color();
  return (t) => {
    if (t <= cs[0][0]) return out.copy(cs[0][1]);
    for (let i = 1; i < cs.length; i++) {
      if (t <= cs[i][0]) {
        const f = (t - cs[i - 1][0]) / (cs[i][0] - cs[i - 1][0]);
        return out.copy(cs[i - 1][1]).lerp(cs[i][1], f);
      }
    }
    return out.copy(cs[cs.length - 1][1]);
  };
}

// ===========================================================================
// audio — fully synthesized, no assets
// ===========================================================================
class MovieAudio {
  constructor() { this.started = false; this.enabled = true; }

  start() {
    if (this.started) { this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.ctx.resume().catch(() => {});
    const unlock = () => {
      if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    const c = this.ctx;

    this.master = c.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(c.destination);

    // loopable brown-ish noise, shared by wind and crowd
    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.5;
    }
    this.noiseBuf = buf;

    const wind = c.createBufferSource();
    wind.buffer = buf; wind.loop = true;
    const wf = c.createBiquadFilter();
    wf.type = 'lowpass'; wf.frequency.value = 320;
    this.windGain = c.createGain(); this.windGain.gain.value = 0;
    wind.connect(wf); wf.connect(this.windGain); this.windGain.connect(this.master);
    wind.start();

    const crowd = c.createBufferSource();
    crowd.buffer = buf; crowd.loop = true; crowd.playbackRate.value = 0.72;
    const bf = c.createBiquadFilter();
    bf.type = 'bandpass'; bf.frequency.value = 340; bf.Q.value = 0.9;
    this.crowdGain = c.createGain(); this.crowdGain.gain.value = 0;
    crowd.connect(bf); bf.connect(this.crowdGain); this.crowdGain.connect(this.master);
    crowd.start();

    this.started = true;
  }

  setEnabled(on) {
    this.enabled = on;
    if (this.master) this.master.gain.value = on ? 0.9 : 0;
  }

  chirp() {
    if (!this.started || !this.enabled) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = 'sine';
    const f0 = 1800 + Math.random() * 1400;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.45, t + 0.08);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.85, t + 0.19);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.035, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.24);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.28);
  }

  whistle() {
    if (!this.started || !this.enabled) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + 0.85);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.014, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.95);
  }

  boom(size = 1) {
    if (!this.started || !this.enabled) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(850, t);
    f.frequency.exponentialRampToValueAtTime(80, t + 0.75);
    const g = c.createGain();
    g.gain.setValueAtTime(0.42 * size, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.95);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + 1.05);
  }

  update(playing, excitement, night) {
    if (!this.started) return;
    const t = this.ctx.currentTime;
    this.crowdGain.gain.setTargetAtTime(playing ? 0.012 + 0.085 * excitement : 0, t, 0.4);
    this.windGain.gain.setTargetAtTime(playing ? 0.035 + 0.03 * night : 0, t, 0.4);
  }
}

// ===========================================================================
// renderer / scene basics
// ===========================================================================
const $ = (id) => document.getElementById(id);
const canvas = $('c');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8d0, 130, 400);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
camera.position.set(6, 18, 74);

const world = new THREE.Group();
scene.add(world);

// shared state driven by the timeline
const state = {
  night: 0.06,
  excitement: 0.25,
  fireworksActive: false,
};

// collections animated from the timeline
const nightWindowMats = [];   // window panes that glow after dark
const lanternLights = [];     // THREE.PointLights
const glowMats = [];          // emissive materials ramping up at night
const smokeSources = [];      // {x,y,z, rate, acc}

// ===========================================================================
// terrain
// ===========================================================================
function terrainHeight(x, z) {
  let h =
    1.15 * Math.sin(x * 0.045 + 1.7) * Math.cos(z * 0.05 + 0.4) +
    0.75 * Math.sin(x * 0.11 + 4.2) * Math.sin(z * 0.09 + 2.1) +
    0.35 * Math.sin(x * 0.23 + 0.8) * Math.cos(z * 0.19 + 3.3);
  const f = Math.exp(-(x * x + z * z) / 900); // flatten the party field
  return h * (1 - 0.72 * f);
}
const groundY = (x, z) => terrainHeight(x, z);

function buildTerrain() {
  const geo = new THREE.PlaneGeometry(300, 300, 128, 128);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const gA = new THREE.Color(0x5f8f3e), gB = new THREE.Color(0x7fae4e),
        gC = new THREE.Color(0x8fa04a), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainHeight(x, z));
    const n = frac(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453);
    tmp.copy(gA).lerp(gB, n);
    if (frac(n * 7.13) > 0.8) tmp.lerp(gC, 0.5);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })
  );
  mesh.receiveShadow = true;
  world.add(mesh);
}

// ===========================================================================
// the Hill + Bag End
// ===========================================================================
const HILL_POS = new THREE.Vector3(0, -3.5, -42);
const HILL_SCALE = new THREE.Vector3(24, 14, 20);

function buildHillAndBagEnd() {
  const hill = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({ color: 0x67963f, roughness: 1 })
  );
  hill.scale.copy(HILL_SCALE);
  hill.position.copy(HILL_POS);
  hill.castShadow = true;
  hill.receiveShadow = true;
  world.add(hill);

  const bagEnd = new THREE.Group();
  world.add(bagEnd);

  const wood = new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 0.85 });
  const brass = new THREE.MeshStandardMaterial({ color: 0xc8a44a, roughness: 0.4, metalness: 0.6 });

  // round green door, proud of the slope
  const door = new THREE.Mesh(
    new THREE.CircleGeometry(1.55, 32),
    new THREE.MeshStandardMaterial({ color: 0x3e6b35, roughness: 0.7 })
  );
  door.position.set(0, 3.0, -23.0);
  bagEnd.add(door);

  const frame = new THREE.Mesh(new THREE.TorusGeometry(1.62, 0.22, 12, 40), wood);
  frame.position.copy(door.position);
  bagEnd.add(frame);

  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), brass);
  knob.position.set(0.75, 3.0, -22.85);
  bagEnd.add(knob);

  // grassy step hiding the seam where the door meets the slope
  const step = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0x67963f, roughness: 1 })
  );
  step.scale.set(2.8, 1.0, 1.5);
  step.position.set(0, 0.55, -22.3);
  bagEnd.add(step);

  // round windows either side
  const winFrameMat = wood;
  for (const sx of [-1, 1]) {
    const pane = new THREE.Mesh(
      new THREE.CircleGeometry(0.72, 24),
      new THREE.MeshStandardMaterial({
        color: 0x2a2f38, roughness: 0.3,
        emissive: 0xffb85c, emissiveIntensity: 0,
      })
    );
    pane.position.set(sx * 4.6, 3.6, -23.9);
    nightWindowMats.push(pane.material);
    bagEnd.add(pane);
    const wf = new THREE.Mesh(new THREE.TorusGeometry(0.76, 0.12, 10, 28), winFrameMat);
    wf.position.copy(pane.position);
    bagEnd.add(wf);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.5, 0.06), winFrameMat);
    bar.position.set(sx * 4.6, 3.6, -23.85);
    bagEnd.add(bar);
    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 0.06), winFrameMat);
    bar2.position.set(sx * 4.6, 3.6, -23.85);
    bagEnd.add(bar2);
  }

  // chimney up on the crown
  const chimney = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 2.6, 0.9),
    new THREE.MeshStandardMaterial({ color: 0x9c6b52, roughness: 0.95 })
  );
  chimney.position.set(3, 10.4, -34);
  chimney.castShadow = true;
  bagEnd.add(chimney);
  smokeSources.push({ x: 3, y: 11.8, z: -34, rate: 2.4, acc: 0 });

  // garden flowers spilling down from the door
  addFlowerPatch(0, -21, 7, 160);

  // the path down from Bag End
  buildPathRibbon([
    [0, -23.2], [0, -16], [1.2, -8], [0.5, 0], [-3, 7], [-9, 13], [-16, 16], [-22, 14.5],
  ], 1.7);
}

function buildPathRibbon(pts2, width) {
  const pts = pts2.map(([x, z]) => new THREE.Vector3(x, 0, z));
  const curve = new THREE.CatmullRomCurve3(pts);
  const N = 90;
  const posArr = [], idxArr = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const p = curve.getPoint(u);
    const tan = curve.getTangent(u);
    const nx = -tan.z, nz = tan.x;
    const nl = Math.hypot(nx, nz) || 1;
    const ox = (nx / nl) * width / 2, oz = (nz / nl) * width / 2;
    const y = groundY(p.x, p.z) + 0.07;
    posArr.push(p.x - ox, y, p.z - oz, p.x + ox, y, p.z + oz);
    if (i > 0) {
      const a = 2 * i, b = 2 * i + 1, c2 = 2 * i - 2, d2 = 2 * i - 1;
      idxArr.push(a, c2, b, b, c2, d2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  geo.setIndex(idxArr);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ color: 0xb09a6c, roughness: 1, side: THREE.DoubleSide })
  );
  mesh.receiveShadow = true;
  world.add(mesh);
}

// ===========================================================================
// flowers & gardens
// ===========================================================================
const flowerDummy = new THREE.Object3D();
function addFlowerPatch(cx, cz, radius, count) {
  const palette = [0xf5f2e8, 0xf2d54a, 0xe88ab0, 0xd84a3a, 0xb89af2];
  const geo = new THREE.SphereGeometry(0.05, 6, 5);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
  const inst = new THREE.InstancedMesh(geo, mat, count);
  const col = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const a = rr(0, TAU), r = radius * Math.sqrt(rng());
    const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
    flowerDummy.position.set(x, groundY(x, z) + 0.04, z);
    flowerDummy.scale.setScalar(rr(0.7, 1.5));
    flowerDummy.updateMatrix();
    inst.setMatrixAt(i, flowerDummy.matrix);
    inst.setColorAt(i, col.setHex(pick(palette)));
  }
  inst.instanceColor.needsUpdate = true;
  world.add(inst);
}

// ===========================================================================
// trees
// ===========================================================================
function makeTree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunkH = 4.2 * s;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28 * s, 0.5 * s, trunkH, 8),

    const y = groundY(x, z);

    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.17, 10, 8),
      new THREE.MeshStandardMaterial({
        color: 0xffd9a0, emissive: 0xffb35c, emissiveIntensity: 0,
      })
    );
    bulb.position.set(x, y + 3.3, z);
    glowMats.push(bulb.material);
    world.add(bulb);
    if (i % 2 === 0) {
      const pl = new THREE.PointLight(0xffb35c, 0, 20, 2);
      pl.position.set(x, y + 3.3, z);
      lanternLights.push(pl);
      world.add(pl);
    }
    polePositions.push(new THREE.Vector3(x, y + 3.2, z));
  }

  // string lights sagging between poles
  const bulbGeo = new THREE.SphereGeometry(0.055, 6, 5);
  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0xffe8c0, emissive: 0xffc87a, emissiveIntensity: 0,
  });
  glowMats.push(bulbMat);
  const perSpan = 11;
  const total = polePositions.length * perSpan;
  const inst = new THREE.InstancedMesh(bulbGeo, bulbMat, total);
  const dummy = new THREE.Object3D();
  let k = 0;
  for (let i = 0; i < polePositions.length; i++) {
    const a = polePositions[i], b = polePositions[(i + 1) % polePositions.length];
    for (let j = 0; j < perSpan; j++) {
      const u = j / (perSpan - 1);
      const p = new THREE.Vector3().lerpVectors(a, b, u);
      p.y -= Math.sin(u * Math.PI) * 0.75;
      dummy.position.copy(p);
      dummy.updateMatrix();
      inst.setMatrixAt(k++, dummy.matrix);
    }
  }
  world.add(inst);
}

function glowTexture() {

}

function cloudTexture() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;

  for (let i = 0; i < 7; i++) {
    const x = 40 + rng() * 176, y = 45 + rng() * 38, r = 22 + rng() * 30;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,.75)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 128);
  }
  return new THREE.CanvasTexture(cv);
}

function buildSky() {
  skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: { uNight: { value: 0.06 } },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uNight;
      varying vec3 vDir;
      void main() {
        float h = clamp(normalize(vDir).y * 0.5 + 0.5, 0.0, 1.0);
        vec3 dayB   = mix(vec3(0.87, 0.90, 0.84), vec3(0.36, 0.56, 0.84), pow(h, 0.62));
        vec3 nightB = mix(vec3(0.10, 0.11, 0.19), vec3(0.012, 0.02, 0.05), pow(h, 0.62));
        vec3 col = mix(dayB, nightB, uNight);
        float dusk = clamp(1.0 - abs(uNight - 0.45) / 0.34, 0.0, 1.0);
        col += vec3(0.85, 0.42, 0.14) * dusk * pow(1.0 - h, 3.0) * 0.85;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(420, 32, 20), skyMat);
  scene.add(sky);

  const glow = glowTexture();

  sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glow, color: 0xfff3c0, transparent: true, opacity: 1, depthWrite: false,
  }));
  sunSprite.position.set(-170, 60, -150);
  sunSprite.scale.setScalar(60);
  scene.add(sunSprite);

  moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glow, color: 0xdfe8ff, transparent: true, opacity: 0, depthWrite: false,
  }));
  moonSprite.position.set(150, 130, -190);
  moonSprite.scale.setScalar(26);
  scene.add(moonSprite);

  // stars
  const n = 900;
  const posArr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, e = Math.acos(Math.random() * 0.95);
    posArr[i * 3] = Math.cos(a) * Math.sin(e) * 390;
    posArr[i * 3 + 1] = Math.cos(e) * 390 + 12;
    posArr[i * 3 + 2] = Math.sin(a) * Math.sin(e) * 390;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  stars = new THREE.Points(sg, new THREE.PointsMaterial({
    color: 0xffffff, size: 1.6, sizeAttenuation: false,
    transparent: true, opacity: 0, depthWrite: false,
  }));
  scene.add(stars);

  // clouds
  const ctex = cloudTexture();
  for (let i = 0; i < 6; i++) {
    const m = new THREE.SpriteMaterial({
      map: ctex, transparent: true, opacity: rr(0.5, 0.8), depthWrite: false,
    });
    const s = new THREE.Sprite(m);
    s.position.set(rr(-180, 180), rr(55, 95), rr(-220, -60));
    s.scale.set(rr(38, 62), rr(14, 22), 1);
    s.userData.speed = rr(1.2, 2.6);
    clouds.push(s);
    scene.add(s);
  }

  sunLight = new THREE.DirectionalLight(0xfff2d8, 2.6);
  sunLight.position.set(70, 95, 55);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.left = -85;
  sunLight.shadow.camera.right = 85;
  sunLight.shadow.camera.top = 85;
  sunLight.shadow.camera.bottom = -85;
  sunLight.shadow.camera.near = 10;
  sunLight.shadow.camera.far = 320;
  sunLight.shadow.bias = -0.0006;
  scene.add(sunLight);
  scene.add(sunLight.target);

  hemiLight = new THREE.HemisphereLight(0xbcd4ee, 0x7a9a56, 0.8);
  scene.add(hemiLight);
}

const smokeSprites = [];
let smokeTex;
function buildSmoke() {
  smokeTex = glowTexture();
}
function spawnSmoke(src) {
  if (smokeSprites.length > 60) return;
  const m = new THREE.SpriteMaterial({
    map: smokeTex, color: 0xd8d4cc, transparent: true, opacity: 0.32, depthWrite: false,
  });
  const s = new THREE.Sprite(m);
  s.position.set(src.x + rr(-0.15, 0.15), src.y, src.z + rr(-0.15, 0.15));
  s.scale.setScalar(rr(0.5, 0.9));
  s.userData = { age: 0, life: rr(3.5, 5.5), vy: rr(0.9, 1.4), vx: rr(0.15, 0.4) };
  scene.add(s);
  smokeSprites.push(s);
}
function updateSmoke(dt) {
  for (let i = smokeSprites.length - 1; i >= 0; i--) {
    const s = smokeSprites[i], u = s.userData;
    u.age += dt;
    if (u.age >= u.life) {
      scene.remove(s);
      s.material.dispose();
      smokeSprites.splice(i, 1);
      continue;
    }
    s.position.y += u.vy * dt;
    s.position.x += u.vx * dt;
    s.scale.setScalar(s.scale.x + dt * 0.55);
    s.material.opacity = 0.32 * (1 - u.age / u.life);
  }
}

function makeHobbit(scale = 1) {
  const g = new THREE.Group();
  const skin = pick(SKIN), hair = pick(HAIR), jacket = pick(JACKETS), breeches = pick(BREECHES);
  const M = (c, r = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });

  for (const sx of [-1, 1]) {

    foot.scale.set(1.15, 0.7, 1.5);
    foot.position.set(sx * 0.1, 0.07, 0.05);
    g.add(foot);
  }

  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.185, 0.3, 6, 12), M(jacket));
  body.position.y = 0.56;
  body.castShadow = true;
  g.add(body);

  const armL = new THREE.Group(), armR = new THREE.Group();
  for (const [sx, arm] of [[-1, armL], [1, armR]]) {
    const sleeve = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.2, 4, 8), M(jacket));
    sleeve.position.y = -0.12;
    sleeve.castShadow = true;
    arm.add(sleeve);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), M(skin));
    hand.position.y = -0.26;
    arm.add(hand);
    arm.position.set(sx * 0.235, 0.74, 0);
    arm.rotation.z = sx * 0.18;
    g.add(arm);
  }

  const head = new THREE.Group();
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.145, 12, 10), M(skin, 0.7));
  face.castShadow = true;
  head.add(face);
  const curls = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 12, 8, 0, TAU, 0, Math.PI / 2),
    M(hair)
  );
  curls.position.y = 0.015;
  head.add(curls);
  head.position.y = 1.0;
  g.add(head);

  g.scale.setScalar(scale);
  g.userData = { armL, armR, head, phase: rr(0, TAU) };
  return g;
}

function placeHobbit(h, x, z) {
  h.position.set(x, groundY(x, z), z);
}

function buildHobbits() {
  // Bilbo himself, at his own round door
  const bilbo = makeHobbit(1.0);
  bilbo.userData.role = 'bilbo';
  placeHobbit(bilbo, 1.1, -20.2);
  bilbo.lookAt(1.1, 0, 0);
  world.add(bilbo);
  hobbits.push(bilbo);

  // listeners gathered at the door for the announcement
  for (let i = 0; i < 5; i++) {
    const a = lerp(-1.05, 1.05, i / 4);
    const x = Math.sin(a) * 4.2, z = -24 + Math.cos(a) * 4.0;
    const h = makeHobbit(rr(0.9, 1.05));
    h.userData.role = 'door';
    placeHobbit(h, x, z);
    h.lookAt(0, h.position.y, -23.4);
    world.add(h);
    hobbits.push(h);
  }

  // gossip clusters around the field
  const clusters = [[-4, 12], [6.5, 9.5], [-1, 17.5], [10, 19], [-13, 13]];
  for (const [cx, cz] of clusters) {
    const n = 3 + Math.floor(rng() * 2);
    for (let i = 0; i < n; i++) {
      const a = rr(0, TAU), r = rr(0.9, 1.9);
      const h = makeHobbit(rr(0.9, 1.08));
      h.userData.role = 'talk';
      h.userData.center = new THREE.Vector2(cx, cz);
      placeHobbit(h, cx + Math.cos(a) * r, cz + Math.sin(a) * r);
      world.add(h);
      hobbits.push(h);
    }
  }

  // strollers circulating between Bag End, the field and the village
  for (let i = 0; i < 10; i++) {
    const h = makeHobbit(rr(0.92, 1.1));
    h.userData.role = 'stroll';
    h.userData.u0 = i / 10;
    h.userData.speed = rr(0.9, 1.5);
    world.add(h);
    hobbits.push(h);
  }

  // excited children circling the party field
  for (let i = 0; i < 4; i++) {
    const h = makeHobbit(rr(0.68, 0.8));
    h.userData.role = 'run';
    h.userData.phase = rr(0, TAU);
    h.userData.speed = rr(1.6, 2.4) * (rng() > 0.5 ? 1 : -1);
    h.userData.radius = rr(6.5, 9);
    world.add(h);
    hobbits.push(h);
  }
}

const _look = new THREE.Vector3();
function updateHobbits(T, dtAnim) {
  const excite = state.excitement;
  const gazeUp = T > 61 ? clamp((T - 61) / 3, 0, 1) : 0;
  for (const h of hobbits) {
    const u = h.userData;
    const t = T * 1 + u.phase;
    switch (u.role) {
      case 'bilbo': {
        // waves to his guests in bursts
        const wave = Math.sin(T * 0.9 + 1) > 0.2 ? 1 : 0;
        u.armR.rotation.z = 0.18 - wave * (2.4 + Math.sin(T * 6) * 0.3);
        u.armL.rotation.z = -0.18 + Math.sin(t * 2.2) * 0.08;
        u.head.rotation.y = Math.sin(t * 0.8) * 0.3;
        break;
      }
      case 'door': {
        u.armR.rotation.x = -0.3 + Math.sin(t * 2.9) * 0.5 * excite;
        u.armL.rotation.x = -0.3 + Math.sin(t * 2.3 + 1.3) * 0.5 * excite;
        u.head.rotation.y = Math.sin(t * 1.1) * 0.25;
        u.head.rotation.x = -gazeUp * 0.5 + Math.sin(t * 3.3) * 0.06;
        break;
      }
      case 'talk': {
        // face the middle of the cluster, gesture, lean in
        const dx = u.center.x - h.position.x, dz = u.center.y - h.position.z;
        h.lookAt(h.position.x + dx, h.position.y, h.position.z + dz);
        u.armR.rotation.x = -0.35 + Math.sin(t * 3.1) * 0.55 * excite;
        u.armL.rotation.x = -0.3 + Math.sin(t * 2.6 + 2) * 0.45 * excite;
        u.head.rotation.y = Math.sin(t * 1.4) * 0.3;
        u.head.rotation.x = -gazeUp * 0.55 + Math.sin(t * 3.6) * 0.07;
        // the really excited ones hop
        h.position.y = groundY(h.position.x, h.position.z) +
          Math.max(0, Math.sin(t * 5.2)) * 0.14 * excite;
        break;
      }
      case 'stroll': {
        const uu = frac(u.u0 + (T * u.speed * (0.7 + 0.6 * excite)) / strollerLen);
        const p = strollerCurve.getPoint(uu);
        const tan = strollerCurve.getTangent(uu);
        const y = groundY(p.x, p.z);
        h.position.set(p.x, y + Math.abs(Math.sin(T * 6 + u.phase)) * 0.04, p.z);
        _look.set(p.x + tan.x, h.position.y, p.z + tan.z);
        h.lookAt(_look);
        u.armL.rotation.x = Math.sin(T * 6 + u.phase) * 0.4;
        u.armR.rotation.x = -Math.sin(T * 6 + u.phase) * 0.4;
        u.head.rotation.x = -gazeUp * 0.5;
        break;
      }
      case 'run': {
        const a = u.phase + T * u.speed * (0.8 + 0.5 * excite);
        const x = 2 + Math.cos(a) * u.radius;
        const z = 15 + Math.sin(a) * u.radius * 0.8;
        h.position.set(x, groundY(x, z) + Math.abs(Math.sin(T * 9 + u.phase)) * 0.09, z);
        _look.set(
          x - Math.sin(a) * u.radius * Math.sign(u.speed),
          h.position.y,
          z + Math.cos(a) * u.radius * 0.8 * Math.sign(u.speed)
        );
        h.lookAt(_look);
        u.armL.rotation.x = Math.sin(T * 9 + u.phase) * 0.7;
        u.armR.rotation.x = -Math.sin(T * 9 + u.phase) * 0.7;
        u.head.rotation.x = -gazeUp * 0.6;
        break;
      }
    }
  }
  void dtAnim;
}

// ===========================================================================
// fireworks
// ===========================================================================
const fireworks = {
  launches: [],
  active: new Map(),
  light: null,
  rocketGeo: new THREE.SphereGeometry(0.14, 8, 6),
  lastT: 0,
};

const FW_COLORS = [0xff5a4a, 0xffc850, 0x7ad0ff, 0x8aff8a, 0xf08aff, 0xffffff];

function buildFireworks() {
  fireworks.light = new THREE.PointLight(0xffd0a0, 0, 260, 1.6);
  fireworks.light.position.set(0, 50, -45);
  scene.add(fireworks.light);

  // a fixed, seeded schedule: every rocket and burst is a pure function of T,
  // so seeking the timeline always shows the correct sky
  let t = 63.5;
  while (t < DURATION - 2.5) {
    const kind = pick(['sphere', 'sphere', 'ring', 'willow']);
    const n = kind === 'willow' ? 110 : 150;
    const velArr = new Float32Array(n * 3);
    const colArr = new Float32Array(n * 3);
    const base = new THREE.Color(pick(FW_COLORS));
    const tmp = new THREE.Color();
    for (let i = 0; i < n; i++) {
      let vx, vy, vz;
      if (kind === 'ring') {
        const a = (i / n) * TAU;
        const sp = rr(10.5, 12.5);
        vx = Math.cos(a) * sp; vy = Math.sin(a) * sp * 0.55; vz = rr(-2, 2);
      } else {
        const a = rr(0, TAU), e = Math.acos(rr(-1, 1));
        const sp = kind === 'willow' ? rr(4, 9) : rr(6, 13);
        vx = Math.cos(a) * Math.sin(e) * sp;
        vy = Math.cos(e) * sp;
        vz = Math.sin(a) * Math.sin(e) * sp;
      }
      velArr[i * 3] = vx; velArr[i * 3 + 1] = vy; velArr[i * 3 + 2] = vz;
      tmp.copy(base).offsetHSL(rr(-0.03, 0.03), 0, rr(-0.08, 0.18));
      colArr[i * 3] = tmp.r; colArr[i * 3 + 1] = tmp.g; colArr[i * 3 + 2] = tmp.b;
    }
    fireworks.launches.push({
      t0: t,
      x: rr(-14, 14), z: rr(-52, -38),
      velY: rr(24, 32), explodeY: rr(46, 72),
      kind, n, velArr, colArr,
      life: kind === 'willow' ? 3.4 : 2.2,
      gravity: kind === 'willow' ? 4.6 : 3.1,
      color: base.getHex(),
    });
    t += rr(0.8, 1.7);
  }
}

const _fwOrigin = new THREE.Vector3();
function updateFireworks(dt, T) {
  const fw = fireworks;
  void dt;

  // sound events only when playback actually crosses them
  if (playing && T >= fw.lastT && T - fw.lastT < 0.5) {
    for (const L of fw.launches) {
      if (L.t0 > T) break;
      if (L.t0 > fw.lastT && L.t0 <= T) audio.whistle();
      const te = L.t0 + (L.explodeY - 11) / L.velY;
      if (te > fw.lastT && te <= T) audio.boom(L.kind === 'willow' ? 1.15 : 1);
    }
  }
  fw.lastT = T;

  let flash = 0;
  for (let i = 0; i < fw.launches.length; i++) {
    const L = fw.launches[i];
    if (L.t0 > T) break;
    const tRise = (L.explodeY - 11) / L.velY;
    const age = T - L.t0;
    let a = fw.active.get(i);
    if (age > tRise + L.life) {
      if (a) {
        if (a.rocket) { scene.remove(a.rocket); a.rocket.material.dispose(); }
        if (a.burst) { scene.remove(a.burst); a.burst.geometry.dispose(); a.burst.material.dispose(); }
        fw.active.delete(i);
      }
      continue;
    }
    if (!a) { a = {}; fw.active.set(i, a); }

    if (age <= tRise) {
      if (a.burst) { scene.remove(a.burst); a.burst.geometry.dispose(); a.burst.material.dispose(); a.burst = null; }
      if (!a.rocket) {
        a.rocket = new THREE.Mesh(fw.rocketGeo, new THREE.MeshBasicMaterial({ color: 0xffd8a0 }));
        scene.add(a.rocket);
      }
      a.rocket.position.set(L.x + age * 1.2, 11 + L.velY * age - 1.1 * age * age, L.z);
    } else {
      if (a.rocket) { scene.remove(a.rocket); a.rocket.material.dispose(); a.rocket = null; }
      const bAge = age - tRise;
      if (!a.burst) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(L.n * 3), 3));
        geo.setAttribute('color', new THREE.BufferAttribute(L.colArr, 3));
        a.burst = new THREE.Points(geo, new THREE.PointsMaterial({
          size: 0.95, vertexColors: true, transparent: true, opacity: 1,
          blending: THREE.AdditiveBlending, depthWrite: false,
        }));
        a.burst.frustumCulled = false;
        scene.add(a.burst);
      }
      _fwOrigin.set(L.x + tRise * 1.2, L.explodeY, L.z);
      const pos = a.burst.geometry.attributes.position.array;
      const damp = 1 - 0.4 * (bAge / L.life);
      for (let j = 0; j < L.n; j++) {
        const j3 = j * 3;
        pos[j3] = _fwOrigin.x + L.velArr[j3] * bAge * damp;
        pos[j3 + 1] = _fwOrigin.y + L.velArr[j3 + 1] * bAge * damp - 0.5 * L.gravity * bAge * bAge;
        pos[j3 + 2] = _fwOrigin.z + L.velArr[j3 + 2] * bAge * damp;
      }
      a.burst.geometry.attributes.position.needsUpdate = true;
      a.burst.material.opacity = clamp(1 - bAge / L.life, 0, 1);
      if (bAge < 0.5) {
        const k = 900 * (1 - bAge / 0.5);
        if (k > flash) { flash = k; fw.light.position.copy(_fwOrigin); fw.light.color.setHex(L.color); }
      }
    }
  }
  fw.light.intensity = flash;
}

let acc = 0;
for (const s of SHOTS) { s.start = acc; acc += s.dur; }
const DURATION = acc;

const shotCam = {};
for (const s of SHOTS) {
  const pk = new THREE.CatmullRomCurve3(s.keys.map(k => new THREE.Vector3(...k.p)), false, 'centripetal');
  const lk = new THREE.CatmullRomCurve3(s.keys.map(k => new THREE.Vector3(...k.l)), false, 'centripetal');
  shotCam[s.id] = { pk, lk };
}

const nightAt = schedule([
  [0, 0.06], [14, 0.1], [26, 0.16], [40, 0.24],
  [46, 0.42], [52, 0.62], [58, 0.82], [64, 0.95], [DURATION, 0.98],
]);
const exciteAt = schedule([
  [0, 0.25], [26, 0.4], [40, 0.68], [52, 0.82], [64, 1], [DURATION, 1],
]);

// ===========================================================================
// playback
// ===========================================================================
const audio = new MovieAudio();
const capEl = $('caption'), fadeEl = $('fade'), titleEl = $('title');
const playBtn = $('play'), loadFill = $('loadfill'), loadTxt = $('loadtxt');
const uiEl = $('ui'), fillEl = $('fill'), marksEl = $('marks'), tcEl = $('tc');
const shotEl = $('shotname'), bPlay = $('bPlay');

let movieT = 0, playing = false, lastNow = performance.now();
let curShot = null, lastCaption = null;

function timecode(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function shotAt(T) {
  for (const s of SHOTS) if (T < s.start + s.dur) return s;
  return SHOTS[SHOTS.length - 1];
}

const _pos = new THREE.Vector3(), _look2 = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;

  if (playing) {
    movieT += dt;
    if (movieT >= DURATION) {
      movieT = DURATION;
      playing = false;
      bPlay.textContent = 'Replay';
    }
  }

  const T = movieT;
  const shot = shotAt(T);
  const ts = T - shot.start;
  const u = smooth(clamp(ts / shot.dur, 0, 1));

  // camera
  const cams = shotCam[shot.id];
  cams.pk.getPoint(u, _pos);
  cams.lk.getPoint(u, _look2);
  camera.position.copy(_pos);
  camera.lookAt(_look2);

  // dip to black between shots
  let fade = 0;
  if (shot !== SHOTS[0]) fade = Math.max(fade, clamp(1 - ts / 0.55, 0, 1));
  if (shot !== SHOTS[SHOTS.length - 1]) fade = Math.max(fade, clamp((ts - (shot.dur - 0.55)) / 0.55, 0, 1));
  else fade = Math.max(fade, clamp((ts - (shot.dur - 1.2)) / 1.2, 0, 1));
  fadeEl.style.opacity = fade.toFixed(3);

  // captions
  const showCap = ts > shot.dur * 0.05 && ts < shot.dur * 0.94 && fade < 0.5;
  if (showCap) {
    if (lastCaption !== shot.caption) {
      capEl.innerHTML = shot.caption;
      lastCaption = shot.caption;
    }
    capEl.classList.add('show');
  } else {
    capEl.classList.remove('show');
    if (!showCap) lastCaption = null;
  }

  // world state
  state.night = nightAt(T);
  state.excitement = exciteAt(T);
  state.fireworksActive = T > 63 && playing;

  skyMat.uniforms.uNight.value = state.night;
  stars.material.opacity = clamp((state.night - 0.55) / 0.35, 0, 1) * 0.95;
  sunSprite.material.opacity = clamp(1 - state.night * 1.6, 0, 1);
  moonSprite.material.opacity = clamp((state.night - 0.6) / 0.3, 0, 1) * 0.9;
  scene.fog.color.copy(fogAt(state.night));

  sunLight.color.copy(sunColorAt(state.night));
  sunLight.intensity = sunIntAt(state.night);
  hemiLight.color.copy(hemiSkyAt(state.night));
  hemiLight.groundColor.copy(hemiGndAt(state.night));
  hemiLight.intensity = lerp(0.8, 0.32, state.night);

  const lanternOn = clamp((state.night - 0.5) / 0.25, 0, 1);
  for (const m of glowMats) m.emissiveIntensity = lanternOn * 2.4;
  for (const l of lanternLights) l.intensity = lanternOn * 14;
  const winOn = clamp((state.night - 0.42) / 0.3, 0, 1);
  for (const m of nightWindowMats) m.emissiveIntensity = winOn * 1.7;
  candleFlames.emissiveIntensity = 2.2 + Math.sin(now * 0.013) * 0.6;

  for (const c of clouds) {
    c.position.x += c.userData.speed * dt * (playing ? 1 : 0.2);
    if (c.position.x > 240) c.position.x = -240;
    c.material.color.setScalar(lerp(1, 0.22, state.night));
  }

  // smoke from chimneys
  const sdt = playing ? dt : 0;
  for (const src of smokeSources) {
    src.acc += sdt;
    const interval = 1 / src.rate;
    while (src.acc > interval) { src.acc -= interval; spawnSmoke(src); }
  }
  updateSmoke(sdt);

  updateHobbits(T, sdt);
  updateFireworks(sdt, T);

  // ambience: birdsong while it is still day
  if (playing && state.night < 0.4 && Math.random() < dt * 0.55) audio.chirp();
  audio.update(playing, state.excitement, state.night);

  // transport readouts
  fillEl.style.width = `${(T / DURATION) * 100}%`;
  tcEl.textContent = `${timecode(T)} / ${timecode(DURATION)}`;
  if (curShot !== shot) {
    curShot = shot;
    shotEl.textContent = shot.title;
  }

  renderer.render(scene, camera);
}

function seek(t) {
  movieT = clamp(t, 0, DURATION);
  if (movieT < DURATION - 1e-3 && bPlay.textContent === 'Replay') bPlay.textContent = 'Play';
}

function seekShot(dir) {
  const shot = shotAt(movieT);
  const i = SHOTS.indexOf(shot);
  if (dir > 0) {
    if (SHOTS[i + 1]) seek(SHOTS[i + 1].start);
    else seek(DURATION);
  } else if (movieT > shot.start + 0.5) {
    seek(shot.start);
  } else if (SHOTS[i - 1]) {
    seek(SHOTS[i - 1].start);
  } else {
    seek(0);
  }
}

let uiTimer = null;
function showUI() {
  document.body.classList.remove('hideui');
  clearTimeout(uiTimer);
  if (playing) uiTimer = setTimeout(() => document.body.classList.add('hideui'), 3000);
}
window.addEventListener('pointermove', showUI);

function start() {
  titleEl.classList.add('gone');
  document.body.classList.remove('titlemode');

  bPlay.textContent = 'Pause';
  showUI();
  try { audio.start(); } catch { /* silent film, then */ }
}
playBtn.addEventListener('click', start);

bPlay.addEventListener('click', () => {
  if (movieT >= DURATION - 1e-3) seek(0);
  playing = !playing;
  bPlay.textContent = playing ? 'Pause' : 'Play';
  showUI();
});

$('bPrev').addEventListener('click', () => seekShot(-1));
$('bNext').addEventListener('click', () => seekShot(1));

$('bCap').addEventListener('click', (e) => {

  e.currentTarget.classList.toggle('on', !document.body.classList.contains('nocap'));
});
$('bSound').addEventListener('click', async (e) => {
  const on = !e.currentTarget.classList.contains('on');
  e.currentTarget.classList.toggle('on', on);

  audio.setEnabled(on);
});
$('bFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

const scrub = $('scrub');
function seekFromEvent(e) {
  const r = scrub.getBoundingClientRect();
  seek(((e.clientX - r.left) / r.width) * DURATION);
}
scrub.addEventListener('pointerdown', (e) => {
  seekFromEvent(e);
  const mv = (ev) => seekFromEvent(ev);
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', () => window.removeEventListener('pointermove', mv), { once: true });
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
  else if (e.key === '[') seekShot(-1);
  else if (e.key === ']') seekShot(1);
  else if (e.key === 'c') $('bCap').click();
  else if (e.key === 'm') $('bSound').click();
  else if (e.key === 'f') $('bFull').click();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ===========================================================================
// boot — build the Shire in visible steps
// ===========================================================================
const steps = [
  ['raising the hills', () => { buildTerrain(); }],
  ['digging bag end', buildHillAndBagEnd],
  ['planting gardens', buildTrees],
  ['building hobbiton', buildVillage],
  ['pitching the marquee', buildPartyField],
  ['inviting the hobbits', buildHobbits],
  ['kindling the sky', buildSky],
  ['rolling the fireworks', () => { buildFireworks(); buildSmoke(); }],
];

const raf = () => new Promise((r) => setTimeout(r, 0));

(async function boot() {
  try {
    for (let i = 0; i < steps.length; i++) {
      loadTxt.textContent = steps[i][0];
      await raf(); await raf();
      steps[i][1]();
      loadFill.style.width = `${Math.round(((i + 1) / steps.length) * 100)}%`;
    }
  } catch (err) {
    loadTxt.textContent = 'failed to build — see console';
    console.error(err);
    return;
  }

  for (const s of SHOTS) {
    if (s.start === 0) continue;
    const i = document.createElement('i');
    i.style.left = `${(s.start / DURATION) * 100}%`;
    marksEl.appendChild(i);
  }
  tcEl.textContent = `0:00 / ${timecode(DURATION)}`;

  requestAnimationFrame(frame);
  playBtn.disabled = false;
  playBtn.textContent = 'Play';
  playBtn.focus({ preventScroll: true });

  // deep links: ?t=<seconds> seeks, ?autoplay starts without the title card
  const params = new URLSearchParams(location.search);
  if (params.has('t')) {
    const t = parseFloat(params.get('t'));
    if (Number.isFinite(t)) seek(t);
  }
  if (params.has('autoplay')) start();
  if (params.has('debug')) {
    setInterval(() => {
      document.title = JSON.stringify({
        T: +movieT.toFixed(1), playing,
        r: fireworks.rockets.length, b: fireworks.bursts.length,
        act: state.fireworksActive,
      });
    }, 500);
  }
})();
</script>
</body>
