<style>

  }

<script type="module">
import * as THREE from 'three';

// ===========================================================================
// utilities
// ===========================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const frac = (v) => v - Math.floor(v);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20240812);
const rr = (a, b) => a + rng() * (b - a);
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

// piecewise-linear schedule sampler
function schedule(stops) {
  return (t) => {
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, v0] = stops[i - 1], [t1, v1] = stops[i];
        return lerp(v0, v1, (t - t0) / (t1 - t0));
      }
    }
    return stops[stops.length - 1][1];
  };
}
function colorSchedule(stops) {
  const cs = stops.map(([t, c]) => [t, new THREE.Color(c)]);
  const out = new THREE.Color();
  return (t) => {
    if (t <= cs[0][0]) return out.copy(cs[0][1]);
    for (let i = 1; i < cs.length; i++) {
      if (t <= cs[i][0]) {
        const f = (t - cs[i - 1][0]) / (cs[i][0] - cs[i - 1][0]);
        return out.copy(cs[i - 1][1]).lerp(cs[i][1], f);
      }
    }
    return out.copy(cs[cs.length - 1][1]);
  };
}

// ===========================================================================
// shared mutable state (declared up-front — referenced across scene builders)
// ===========================================================================
const windowLights = [];   // emissive window materials (village + Bag End)
const cottageWindows = [];
const lanternMats = [];    // emissive lantern bulbs
const treeLightMats = [];  // string lights
const candleFlames = [];   // cake candle flames (flicker)
const smokePuffs = [];     // chimney smoke sprites
const hobbits = [];        // all hobbit groups (animation)
const crowdHobbits = [];
const fireworks = [];      // active firework particles

// ===========================================================================
// audio — fully synthesized with WebAudio, no files
// ===========================================================================
class MovieAudio {
  constructor() { this.started = false; this.enabled = true; }
  start() {
    if (this.started) { this.ctx && this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.started = true;
    const c = new AC();
    this.ctx = c;
    c.resume().catch(() => {});
    const unlock = () => c.state !== 'running' && c.resume().catch(() => {});
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    this.master = c.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(c.destination);

    // shared brown-noise buffer (wind + crowd)
    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b = (b + 0.02 * w) / 1.02;
      d[i] = b * 3.5;
    }
    const noise = (gain) => {
      const src = c.createBufferSource();
      src.buffer = buf; src.loop = true;
      const g = c.createGain(); g.gain.value = gain;
      src.connect(g); g.connect(this.master); src.start();
      return g;
    };

    // wind: slow filtered noise
    this.windGain = noise(0.05);
    const windLP = c.createBiquadFilter();
    windLP.type = 'lowpass'; windLP.frequency.value = 380; windLP.Q.value = 0.7;
    this.windGain.disconnect(); this.windGain.connect(windLP); windLP.connect(this.master);
    this.windMod = c.createGain(); this.windMod.gain.value = 0.5;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.11;
    lfo.connect(this.windMod); this.windMod.connect(windLP.frequency); lfo.start();

    // crowd murmur: band-passed noise, gain driven by scene
    this.crowdGain = noise(0.0);
    const crowdBP = c.createBiquadFilter();
    crowdBP.type = 'bandpass'; crowdBP.frequency.value = 900; crowdBP.Q.value = 0.6;
    this.crowdGain.disconnect(); this.crowdGain.connect(crowdBP); crowdBP.connect(this.master);

    // birdsong: random chirps scheduled on a loop
    this.birdTimer = setInterval(() => {
      if (!this.enabled) return;
      const n = Math.random() < 0.5 ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const t0 = c.currentTime + Math.random() * 0.6;
        const o = c.createOscillator();
        o.type = 'sine';
        const f0 = 2200 + Math.random() * 1800;
        o.frequency.setValueAtTime(f0, t0);
        o.frequency.exponentialRampToValueAtTime(f0 * 1.5, t0 + 0.06);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t0 + 0.14);
        const g = c.createGain();
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.05, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.connect(g); g.connect(this.master);
        o.start(t0); o.stop(t0 + 0.2);
      }
    }, 3000);
  }

  rocket() {
    if (!this.ctx || !this.enabled) return;
    const c = this.ctx, t0 = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t0);
    o.frequency.exponentialRampToValueAtTime(1100, t0 + 1.3);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2000;
    o.connect(lp); lp.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 1.5);
  }

  boom(delay, size) {
    if (!this.ctx || !this.enabled) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const dur = 0.8 + size * 0.4;
    const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.4 + size * 0.3, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500 + size * 400;
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0);
  }

  setSound(on) {
    this.enabled = on;
    if (this.master) this.master.gain.value = on ? 0.9 : 0;
  }
}
const audio = new MovieAudio();

// ===========================================================================
// renderer / scene / camera / lights
// ===========================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8d0, 130, 400);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);

const sun = new THREE.DirectionalLight(0xfff2d6, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
sun.shadow.camera.far = 300;
sun.shadow.bias = -0.0004;
sun.position.set(40, 55, 25);
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x6f8f4f, 0.85);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa8d8, 0.0);
moon.position.set(-40, 60, -20);
scene.add(moon);

// ===========================================================================
// sky — background color + star field
// ===========================================================================
const skyColor = new THREE.Color(0x9fd0ea);
scene.background = skyColor;
const starGeo = new THREE.BufferGeometry();
{
  const N = 400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const th = rr(0, TAU), ph = Math.acos(rr(-1, 1)), r = 350 + rr(0, 60);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) + 5;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, sizeAttenuation: true, transparent: true, opacity: 0 }));
scene.add(stars);

// day-night color schedules (t = global time, 0..DURATION)
const DAY_START = 0, DUSK = 40, NIGHT = 58, NIGHT_END = 82, FINALE = 96;
const sky = colorSchedule([
  [DAY_START, 0x9fd0ea], [DUSK, 0xf2b46a], [NIGHT, 0x0c1024],
  [NIGHT_END, 0x0a0e20], [FINALE, 0x050814],
]);
const fogC = colorSchedule([
  [DAY_START, 0xdfe8d0], [DUSK, 0xd8b98a], [NIGHT, 0x0c1024], [FINALE, 0x050814],
]);
const sunCol = colorSchedule([
  [DAY_START, 0xfff2d6], [DUSK, 0xffb066], [NIGHT, 0x1a2038], [FINALE, 0x141828],
]);
const sunIntensity = schedule([[DAY_START, 2.4], [DUSK, 1.5], [NIGHT, 0.05], [FINALE, 0.02]]);
const hemiIntensity = schedule([[DAY_START, 0.85], [DUSK, 0.6], [NIGHT, 0.18], [FINALE, 0.14]]);
const moonIntensity = schedule([[DAY_START, 0], [DUSK, 0.05], [NIGHT, 0.55], [FINALE, 0.6]]);
const starOpacity = schedule([[DAY_START, 0], [DUSK, 0], [NIGHT, 0.9], [FINALE, 1]]);
const nightGlow = schedule([[DAY_START, 0], [DUSK, 0.1], [NIGHT, 1], [FINALE, 1]]);

// ===========================================================================
// ground
// ===========================================================================
function makeGround() {
  const geo = new THREE.PlaneGeometry(320, 320, 96, 96);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const gA = new THREE.Color(0x5f8f3e), gB = new THREE.Color(0x7fae4e), gC = new THREE.Color(0x8fa04a);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const n = Math.sin(x * 0.045) * Math.cos(z * 0.05) + Math.sin((x + z) * 0.02);
    tmp.copy(gA).lerp(gB, clamp(n * 0.5 + 0.5, 0, 1));
    if (Math.abs(Math.sin(x * 0.13 + 2.0) * Math.sin(z * 0.17)) > 0.8) tmp.copy(gC);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  mesh.receiveShadow = true;
  return mesh;
}
scene.add(makeGround());

// ===========================================================================
// Bag End — the Hill
// ===========================================================================
const HILL_POS = new THREE.Vector3(0, -3.5, -44);
const bagEnd = new THREE.Group();
{
  const hill = new THREE.Mesh(
    new THREE.SphereGeometry(16, 48, 32),
    new THREE.MeshStandardMaterial({ color: 0x67963f, roughness: 1 })
  );
  hill.scale.set(1.25, 0.62, 1.05);
  hill.position.copy(HILL_POS);
  hill.castShadow = true; hill.receiveShadow = true;
  bagEnd.add(hill);

  // round green door
  const doorGroup = new THREE.Group();
  const doorFrame = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.5, 32), new THREE.MeshStandardMaterial({ color: 0x4a3b2a, roughness: 0.8 }));
  doorFrame.rotation.x = Math.PI / 2;
  doorGroup.add(doorFrame);
  const door = new THREE.Mesh(new THREE.CylinderGeometry(1.45, 1.45, 0.35, 32), new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: 0.7 }));
  door.rotation.x = Math.PI / 2;
  door.position.z = 0.2;
  doorGroup.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), new THREE.MeshStandardMaterial({ color: 0xd8b64a, metalness: 0.8, roughness: 0.3 }));
  knob.position.set(-0.9, 0, 0.42);
  doorGroup.add(knob);
  doorGroup.position.set(0, HILL_POS.y + 4.4, HILL_POS.z + 9.4);
  doorGroup.rotation.y = Math.PI;
  bagEnd.add(doorGroup);

  // round windows
  const winMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.4, emissive: 0xffd27a, emissiveIntensity: 0 });
  for (const [x, y, z, r] of [[3.6, 5.6, HILL_POS.z + 5.5, 0.85], [-4.2, 5.0, HILL_POS.z + 5.5, 0.7], [2.0, 6.4, HILL_POS.z + 7.2, 0.55]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.2, 24), winMat);
    w.rotation.x = Math.PI / 2;
    w.position.set(x, y, z);
    const frame = new THREE.Mesh(new THREE.TorusGeometry(r, 0.08, 8, 24), new THREE.MeshStandardMaterial({ color: 0x4a3b2a }));
    frame.position.copy(w.position);
    frame.lookAt(HILL_POS.x, HILL_POS.y + 6, HILL_POS.z);
    bagEnd.add(w); bagEnd.add(frame);
    windowLights.push(winMat);
  }

  // chimney + smoke
  const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 3.4, 12), new THREE.MeshStandardMaterial({ color: 0x8a6f52, roughness: 1 }));
  chimney.position.set(-7.5, HILL_POS.y + 10, HILL_POS.z - 2);
  bagEnd.add(chimney);
  const smokePts = [];
  for (let i = 0; i < 24; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(rr(0.5, 1.0), 8, 8), new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.28 }));
    s.userData = { base: new THREE.Vector3(-7.5 + rr(-0.3, 0.3), HILL_POS.y + 11.8, HILL_POS.z - 2), age: rr(0, 1), speed: rr(0.4, 0.8), drift: rr(-0.4, 0.4) };
    s.position.copy(s.userData.base);
    smokePts.push(s);
    bagEnd.add(s);
  }
  smokePuffs.push(...smokePts);

  // path
  const path = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 26), new THREE.MeshStandardMaterial({ color: 0xc9b27e, roughness: 1 }));
  path.rotation.x = -Math.PI / 2;
  path.position.set(0, 0.15, HILL_POS.z + 11);
  path.receiveShadow = true;
  bagEnd.add(path);
}
scene.add(bagEnd);

// ===========================================================================
// Hobbiton village — cottages, smials, gardens
// ===========================================================================
const village = new THREE.Group();
function makeCottage(x, z, rotY, wallColor, roofColor) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.9, 2.6, 10), new THREE.MeshStandardMaterial({ color: wallColor, roughness: 1 }));
  body.position.y = 1.3;

// fireworks — deterministic particle system
// ===========================================================================
function spawnFirework() {
  const origin = new THREE.Vector3(rr(-18, 18), rr(28, 42), rr(-50, -30));
  const N = 90;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const palette = pick([[0xffc96a, 0xff9a5a], [0x8ac8ff, 0x5a8aff], [0xca8aff, 0xff6ac8], [0x8affaa, 0xc8ff5a], [0xffd8a0, 0xff6a6a]]);
  const mat = new THREE.PointsMaterial({ size: 0.55, vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  const fw = {
    pts, origin,
    life: 0, maxLife: rr(2.4, 3.6),
    vel: new Float32Array(N * 3),
    age: 0,
    explode: false,
    boomPlayed: false,
  };
  // rocket phase
  for (let i = 0; i < N; i++) {
    fw.vel[i * 3] = rr(-0.6, 0.6);
    fw.vel[i * 3 + 1] = rr(9, 14);
    fw.vel[i * 3 + 2] = rr(-0.6, 0.6);
    col[i * 3] = 1; col[i * 3 + 1] = 0.85; col[i * 3 + 2] = 0.5;
  }
  const [c0, c1] = palette;
  const cc0 = new THREE.Color(c0), cc1 = new THREE.Color(c1);
  fw.explodeVels = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const th = rr(0, TAU), ph = Math.acos(rr(-1, 1)), sp = rr(3, 11);
    fw.explodeVels[i * 3] = sp * Math.sin(ph) * Math.cos(th);
    fw.explodeVels[i * 3 + 1] = sp * Math.cos(ph);
    fw.explodeVels[i * 3 + 2] = sp * Math.sin(ph) * Math.sin(th);
    const t = rng();
    const cc = cc0.clone().lerp(cc1, t);
    col[i * 3] = cc.r; col[i * 3 + 1] = cc.g; col[i * 3 + 2] = cc.b;
  }
  pts.position.copy(origin);
  scene.add(pts);
  fireworks.push(fw);
}
function updateFireworks(dt) {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.age += dt;
    const pos = fw.pts.geometry.attributes.position.array;
    if (!fw.explode) {
      // rocket ascent
      for (let j = 0; j < pos.length / 3; j++) {
        pos[j * 3] += fw.vel[j * 3] * dt;
        pos[j * 3 + 1] += fw.vel[j * 3 + 1] * dt;
        pos[j * 3 + 2] += fw.vel[j * 3 + 2] * dt;
        fw.vel[j * 3 + 1] -= 2.5 * dt;
      }
      if (fw.age > 1.15) {
        fw.explode = true;
        fw.life = 0;
        audio.boom(0, 0.6);
      }
    } else {
      fw.life += dt;
      for (let j = 0; j < pos.length / 3; j++) {
        pos[j * 3] += fw.explodeVels[j * 3] * dt;
        pos[j * 3 + 1] += fw.explodeVels[j * 3 + 1] * dt;
        pos[j * 3 + 2] += fw.explodeVels[j * 3 + 2] * dt;
        fw.explodeVels[j * 3 + 1] -= 3.2 * dt;
      }
      fw.pts.material.opacity = Math.max(0, 1 - fw.life / fw.maxLife);
      if (fw.life > fw.maxLife) {
        scene.remove(fw.pts);
        fw.pts.geometry.dispose();
        fw.pts.material.dispose();
        fireworks.splice(i, 1);
      }
    }
    fw.pts.geometry.attributes.position.needsUpdate = true;
  }
}

function shotAt(t) {
  const tt = clamp(t, 0, DURATION - 0.001);
  for (let i = SHOTS.length - 1; i >= 0; i--) if (tt >= SHOTS[i].start) return { shot: SHOTS[i], idx: i, lt: (tt - SHOTS[i].start) / SHOTS[i].dur };
  return { shot: SHOTS[0], idx: 0, lt: 0 };
}
function sampleShot(shot, lt) {
  const keys = shot.keys;
  if (keys.length === 1) return { p: keys[0].p, l: keys[0].l };
  const f = clamp(lt, 0, 1) * (keys.length - 1);
  const i = Math.min(Math.floor(f), keys.length - 2);
  const u = smooth(frac(f));
  const a = keys[i], b = keys[i + 1];
  return {
    p: [lerp(a.p[0], b.p[0], u), lerp(a.p[1], b.p[1], u), lerp(a.p[2], b.p[2], u)],
    l: [lerp(a.l[0], b.l[0], u), lerp(a.l[1], b.l[1], u), lerp(a.l[2], b.l[2], u)],
  };
}

    lastCaption = html;
    capEl.innerHTML = html;
    if (html) { capEl.classList.add('show'); } else { capEl.classList.remove('show'); }
  }
}
function updateUI() {
  fillEl.style.width = (time / DURATION * 100) + '%';
  tcEl.textContent = `${fmt(time)} / ${fmt(DURATION)}`;
  const { shot, idx } = shotAt(time);
  if (idx !== prevShot) {
    prevShot = idx;
    shotnameEl.textContent = shot.title;
  }
  setCaption(showCap ? shot.caption : '');
}

function seek(t) {
  time = clamp(t, 0, DURATION - 0.001);
  updateUI();
}
function togglePlay() {
  if (time >= DURATION - 0.05) seek(0);
  playing = !playing;
  bPlay.textContent = playing ? 'Pause' : 'Play';
  if (playing) audio.start();
}
bPlay.onclick = togglePlay;
bPrev.onclick = () => { const { idx } = shotAt(time); seek(SHOTS[Math.max(0, idx - 1)].start); };
bNext.onclick = () => { const { idx } = shotAt(time); seek(SHOTS[Math.min(SHOTS.length - 1, idx + 1)].start); };
bCap.onclick = () => { showCap = !showCap; bCap.classList.toggle('on', showCap); document.body.classList.toggle('nocap', !showCap); if (!showCap) setCaption(''); };
bSound.onclick = () => { audio.enabled = !audio.enabled; bSound.classList.toggle('on', audio.enabled); audio.setSound(audio.enabled); };
bFull.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
scrubEl.addEventListener('pointerdown', (e) => {
  const r = scrubEl.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * DURATION);
  const move = (ev) => { const rr2 = scrubEl.getBoundingClientRect(); seek((ev.clientX - rr2.left) / rr2.width * DURATION); };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (titleEl.classList.contains('gone')) togglePlay(); }
  else if (e.key === '[') bPrev.onclick();
  else if (e.key === ']') bNext.onclick();
  else if (e.key === 'c') bCap.onclick();
  else if (e.key === 'm') bSound.onclick();
  else if (e.key === 'f') bFull.onclick();
});
let uiTimer;
function showUI() {
  $('ui').classList.add('show');
  document.body.classList.remove('hideui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => { if (playing) { $('ui').classList.remove('show'); document.body.classList.add('hideui'); } }, 2400);
}
window.addEventListener('pointermove', showUI);

// title card → play
const playBtn = $('play');
function start() {
  titleEl.classList.add('gone');
  $('ui').classList.add('show');
  playing = true;
  bPlay.textContent = 'Pause';
  audio.start();
}
playBtn.onclick = start;

// deep links
const q = new URLSearchParams(location.search);
const qT = parseFloat(q.get('t'));
if (!isNaN(qT)) { time = clamp(qT, 0, DURATION - 0.001); }

// ===========================================================================
// animation loop
// ===========================================================================
let lastT = performance.now();
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (playing) {
    time += dt;
    if (time >= DURATION) { time = DURATION - 0.001; playing = false; bPlay.textContent = 'Play'; }
    updateUI();
  }

  const { shot, lt } = shotAt(time);
  const sp = sampleShot(shot, lt);
  camPos.set(sp.p[0], sp.p[1], sp.p[2]);
  camLook.set(sp.l[0], sp.l[1], sp.l[2]);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // day-night environment
  skyColor.copy(sky(time));
  scene.fog.color.copy(fogC(time));
  sun.color.copy(sunCol(time));
  sun.intensity = sunIntensity(time);
  hemi.intensity = hemiIntensity(time);
  moon.intensity = moonIntensity(time);
  stars.material.opacity = starOpacity(time);
  const glow = nightGlow(time);
  for (const m of windowLights) m.emissiveIntensity = glow * (0.7 + 0.3 * Math.sin(time * 0.5 + 1));
  for (const m of lanternMats) m.emissiveIntensity = glow;
  for (const m of treeLightMats) m.emissiveIntensity = glow * 0.9;
  for (const f of candleFlames) f.position.y = 2.35 + Math.sin(time * 12 + f.position.x) * 0.05;

  // smoke
  for (const s of smokePuffs) {
    const u = s.userData;
    u.age += dt * u.speed;
    if (u.age > 1) u.age -= 1;
    s.position.set(u.base.x + Math.sin((u.age + u.drift) * 2) * 0.6, u.base.y + u.age * 3.2, u.base.z + Math.cos(u.age * 2) * 0.4);
    s.scale.setScalar(1 + u.age * 2.2);
    s.material.opacity = 0.3 * (1 - u.age);
  }

  // hobbit animation
  for (const h of hobbits) {
    const role = h.userData.role;
    const ph = h.userData.phase;
    if (role === 'bilbo') {
      const arm = h.userData.waveArm;
      if (arm) arm.rotation.z = -0.4 - Math.abs(Math.sin(time * 4)) * 1.6;
      h.position.y = Math.sin(time * 2) * 0.03;
    } else if (role === 'crowd') {
      h.rotation.y += Math.sin(time * 0.8 + ph) * 0.004;
      h.userData.head.rotation.y = Math.sin(time * 1.3 + ph) * 0.4;
      h.position.y = Math.abs(Math.sin(time * 1.7 + ph)) * 0.02;
    } else if (role === 'stroll') {
      h.position.z += Math.sin(time * 0.5 + ph) * dt * 0.8;
      h.rotation.y += Math.sin(time * 0.3 + ph) * 0.01;
    } else if (role === 'child') {
      const ang = ph + time * h.userData.circleSpeed;
      h.position.x = Math.cos(ang) * h.userData.circleR;
      h.position.z = 8 + Math.sin(ang) * h.userData.circleR;
      h.position.y = Math.abs(Math.sin(time * 10 + ph)) * 0.3;
      h.rotation.y = -ang + Math.PI / 2;
    } else {
      h.rotation.y += Math.sin(time * 0.5 + ph) * 0.005;
    }
    // everyone looks up during the fireworks shot
    if (shot.id === 'fireworks' || shot.id === 'finale') {
      h.userData.head.rotation.x = -0.7;
      h.userData.head.rotation.y = 0;
    } else {
      h.userData.head.rotation.x = Math.sin(time * 0.6 + ph) * 0.05;
    }
  }

  // crowd murmur driven by scene time
  if (audio.crowdGain) {
    const murmur = (shot.id === 'talk' || shot.id === 'field') ? 0.05 : 0.02;
    audio.crowdGain.gain.value = audio.enabled ? murmur * glow * 3 : 0;
    if (audio.windGain) audio.windGain.gain.value = audio.enabled ? 0.04 + glow * 0.02 : 0;
  }

  // fireworks
  if (shot.id === 'fireworks' || shot.id === 'finale') {
    fireworkBudget += dt * (shot.id === 'fireworks' ? 0.9 : 1.4);
    while (fireworkBudget >= 1) { fireworkBudget -= 1; spawnFirework(); audio.rocket(); }
  }
  updateFireworks(dt);

  renderer.render(scene, camera);
}

// ===========================================================================
// boot
// ===========================================================================
seek(time);
playBtn.disabled = false;
playBtn.textContent = q.get('autoplay') !== null ? 'Loading' : 'Play';
requestAnimationFrame(animate);
if (q.get('autoplay') !== null) {
  // slight delay so the title flashes then the film begins
  setTimeout(start, 400);
}
</script>
</body>
</html>
