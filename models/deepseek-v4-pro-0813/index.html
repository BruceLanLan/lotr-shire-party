<script type="module">
import * as THREE from 'three';

// ============================================================================
// The whole film is a function of one number: film time t (seconds).
// Every frame is recomputed from t, so the scrubber, the deep links and the
// offline audio render all agree. Nothing is loaded from disk: the world,
// the hobbits and every sound are built in code at load time.
// ============================================================================

const RECORD = new URLSearchParams(location.search).get('record') !== null;

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (t) => t * t * (3 - 2 * t);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RNG = mulberry32(20260813);
const rr = (a, b) => a + RNG() * (b - a);
const pick = (arr) => arr[Math.floor(RNG() * arr.length)];

function sched(stops) {
  return (t) => {
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, v0] = stops[i - 1], [t1, v1] = stops[i];
        return lerp(v0, v1, (t - t0) / (t1 - t0));
      }
    }
    return stops[stops.length - 1][1];
  };
}
function csched(stops) {
  const cs = stops.map(([t, c]) => [t, new THREE.Color(c)]);
  const o = new THREE.Color();
  return (t) => {
    if (t <= cs[0][0]) return o.copy(cs[0][1]);
    for (let i = 1; i < cs.length; i++) {
      if (t <= cs[i][0]) {
        const f = (t - cs[i - 1][0]) / (cs[i][0] - cs[i - 1][0]);
        return o.copy(cs[i - 1][1]).lerp(cs[i][1], f);
      }
    }
    return o.copy(cs[cs.length - 1][1]);
  };
}

// ============================================================================
// timeline: shots + the verbatim caption, split only at phrase boundaries
// ============================================================================
const CAPTIONS = [
  'When Mr. Bilbo Baggins of Bag End',
  'announced that he would shortly be',
  'celebrating his eleventy-first birthday',
  'with a party of special',
  'magnificence,',
  'there was much talk and excitement in Hobbiton.',
];
const SHOTS = [
  { id: 'bagend',   title: 'Bag End',            dur: 12, cap: 0, fov: 42, keys: [ { p: [3.4, 4.6, -15.0], l: [0, 2.2, -29] }, { p: [3.0, 4.2, -17.0], l: [0, 2.2, -29] } ] },
  { id: 'announce', title: 'The Announcement',   dur: 10, cap: 1, fov: 40, keys: [ { p: [3.6, 2.9, -20.5], l: [0.2, 2.3, -29] }, { p: [3.2, 2.7, -21.5], l: [0.2, 2.3, -29] } ] },
  { id: 'birthday', title: 'Eleventy-first',     dur: 9,  cap: 2, fov: 38, keys: [ { p: [2.2, 2.5, -24.8], l: [0, 2.0, -29.6] }, { p: [1.7, 2.4, -25.6], l: [0, 2.0, -29.6] } ] },
  { id: 'lane',     title: 'Down the Lane',      dur: 11, cap: 3, fov: 46, keys: [ { p: [-5.0, 2.2, -13.5], l: [-2.0, 1.6, 1] }, { p: [-4.6, 2.0, -7.5], l: [-1.4, 1.6, 6] }, { p: [-4.2, 2.0, -1.5], l: [1.2, 1.6, 10] } ] },
  { id: 'field',    title: 'The Party Field',    dur: 12, cap: 4, fov: 44, keys: [ { p: [-23, 6.8, 31], l: [-4, 2.4, 13] }, { p: [-19, 5.6, 28], l: [-2, 2.2, 13] } ] },
  { id: 'dusk',     title: 'Lanternlight',       dur: 10, cap: -1, fov: 44, keys: [ { p: [1, 8.5, 37], l: [0, 2.5, 9] }, { p: [1, 13, 42], l: [0, 1.5, 3] } ] },
  { id: 'talk',     title: 'Much Talk',          dur: 13, cap: 5, fov: 46, keys: [ { p: [-17, 2.4, -7.5], l: [2, 1.1, -13.5] }, { p: [-11, 2.4, -8.5], l: [4, 1.1, -13] } ] },
  { id: 'crowd',    title: 'Excitement',         dur: 11, cap: 5, fov: 46, keys: [ { p: [11, 3.4, -1], l: [-4, 1.2, 14] }, { p: [9, 3.6, 1], l: [-3, 1.3, 15] } ] },
  { id: 'fireworks', title: 'Fireworks',         dur: 13, cap: -1, fov: 44, keys: [ { p: [-1.5, 3.1, 25], l: [0, 22, -38] }, { p: [-1.0, 3.8, 25], l: [0, 26, -40] } ] },
  { id: 'finale',   title: 'A Long-expected Party', dur: 12, cap: -1, fov: 44, keys: [ { p: [0, 13, 48], l: [0, 7, -16] }, { p: [0, 22, 68], l: [0, 5, -20] } ] },
];
let acc = 0;
for (const s of SHOTS) { s.start = acc; acc += s.dur; }
const DURATION = acc; // 113s

function shotAt(t) {
  const tt = clamp(t, 0, DURATION - 0.001);
  for (let i = SHOTS.length - 1; i >= 0; i--) if (tt >= SHOTS[i].start) return { shot: SHOTS[i], idx: i, lt: (tt - SHOTS[i].start) / SHOTS[i].dur };
  return { shot: SHOTS[0], idx: 0, lt: 0 };
}
function sampleShot(shot, lt) {
  const k = shot.keys;
  if (k.length === 1) return { p: k[0].p, l: k[0].l };
  const f = clamp(lt, 0, 1) * (k.length - 1);
  const i = Math.min(Math.floor(f), k.length - 2);
  const u = sstep(f - i);
  const a = k[i], b = k[i + 1];
  return {
    p: [lerp(a.p[0], b.p[0], u), lerp(a.p[1], b.p[1], u), lerp(a.p[2], b.p[2], u)],
    l: [lerp(a.l[0], b.l[0], u), lerp(a.l[1], b.l[1], u), lerp(a.l[2], b.l[2], u)],
  };
}
// dip-to-black between shots, plus opening and closing fades
function fadeOf(t) {
  let o = 0;
  if (t < 1.4) o = Math.max(o, 1 - t / 1.4);
  if (t > DURATION - 1.6) o = Math.max(o, (t - (DURATION - 1.6)) / 1.6);
  for (let i = 1; i < SHOTS.length; i++) {
    const d = Math.abs(t - SHOTS[i].start);
    if (d < 0.7) o = Math.max(o, 1 - d / 0.7);
  }
  return o;
}

// day -> dusk -> night is one continuous sky (and sun arc), never a swap
const DAY = 0, DUSK_A = 52, DUSK_B = 70, NIGHT = 92;
const skyC  = csched([[DAY, 0x9fd0ea], [DUSK_A, 0xf2b46a], [DUSK_B, 0x3a3558], [NIGHT, 0x0b1126], [DURATION, 0x060a1c]]);
const fogC  = csched([[DAY, 0xd8e6c9], [DUSK_A, 0xdfb183], [DUSK_B, 0x463f5f], [NIGHT, 0x0b1126], [DURATION, 0x060a1c]]);
const sunC  = csched([[DAY, 0xfff4d8], [DUSK_A, 0xffc37a], [DUSK_B, 0x5a4a6a], [NIGHT, 0x141a2e], [DURATION, 0x0d1220]]);
const sunI  = sched([[DAY, 2.6], [DUSK_A, 2.2], [DUSK_B, 0.35], [NIGHT, 0.03], [DURATION, 0.02]]);
const hemiI = sched([[DAY, 0.9], [DUSK_A, 0.65], [DUSK_B, 0.25], [NIGHT, 0.16], [DURATION, 0.13]]);
const moonI = sched([[DAY, 0], [DUSK_A, 0], [DUSK_B, 0.2], [NIGHT, 0.6], [DURATION, 0.62]]);
const starO = sched([[DAY, 0], [DUSK_A, 0], [DUSK_B, 0.35], [NIGHT, 0.95], [DURATION, 1]]);
const glow  = sched([[DAY, 0], [DUSK_A, 0.03], [DUSK_B, 0.7], [NIGHT, 1], [DURATION, 1]]);
const sunAngle  = sched([[DAY, -0.30], [40, 0.75], [DUSK_A, 1.05], [DUSK_B, 1.75], [NIGHT, 2.4], [DURATION, 2.9]]);
const moonAngle = sched([[DAY, -0.6], [DUSK_A, -0.5], [DUSK_B, 0.0], [NIGHT, 0.55], [DURATION, 0.8]]);

// ============================================================================
// renderer / scene / camera / lights
// ============================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: RECORD });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8d0, 120, 400);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);

const sun = new THREE.DirectionalLight(0xfff2d6, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -75; sun.shadow.camera.right = 75;
sun.shadow.camera.top = 75; sun.shadow.camera.bottom = -75;
sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x6f8f4f, 0.9);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa8d8, 0);
scene.add(moon);

const skyColor = new THREE.Color(0x9fd0ea);
scene.background = skyColor;

// stars
let stars;
{
  const N = 420, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const th = rr(0, TAU), ph = Math.acos(rr(0, 1));
    const r = 330 + rr(0, 40);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) + 4;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: true, transparent: true, opacity: 0, fog: false }));
  scene.add(stars);
}

// sun and moon discs ride the same continuous arcs as the light
const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(7, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff2c8, fog: false }));
scene.add(sunDisc);
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(5.5, 16, 12), new THREE.MeshBasicMaterial({ color: 0xd8e4f8, fog: false }));
scene.add(moonDisc);

// ============================================================================
// ground: meadow with a real path from the green door to the party field,
// plus a village lane crossing it
// ============================================================================
const PATH = [[0, -29], [0, -26], [-1, -23], [-2.2, -20], [-3.2, -16], [-3.6, -12], [-3.2, -8], [-1.6, -4], [0.6, 0], [2.2, 4], [2.8, 8], [3.0, 11]];
function pathDist(x, z) {
  let best = 1e9;
  for (let i = 0; i < PATH.length - 1; i++) {
    const [x0, z0] = PATH[i], [x1, z1] = PATH[i + 1];
    const dx = x1 - x0, dz = z1 - z0;
    const L2 = dx * dx + dz * dz || 1e-9;
    const u = clamp(((x - x0) * dx + (z - z0) * dz) / L2, 0, 1);
    best = Math.min(best, Math.hypot(x - (x0 + dx * u), z - (z0 + dz * u)));
  }
  return best;
}
// x position + heading yaw of the path at a given z
function pathXY(z) {
  for (let i = 0; i < PATH.length - 1; i++) {
    const [x0, z0] = PATH[i], [x1, z1] = PATH[i + 1];
    if (z >= Math.min(z0, z1) && z <= Math.max(z0, z1)) {
      const f = (z1 === z0) ? 0 : (z - z0) / (z1 - z0);
      return { x: lerp(x0, x1, f), yaw: Math.atan2(x1 - x0, z1 - z0) };
    }
  }
  return { x: PATH[PATH.length - 1][0], yaw: 0 };
}

function makeGround() {
  const W = 340, seg = 120;
  const geo = new THREE.PlaneGeometry(W, W, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const N = pos.count;
  const col = new Float32Array(N * 3);
  const gA = new THREE.Color(0x5e8f3c), gB = new THREE.Color(0x7fae4c), gC = new THREE.Color(0x93a44c);
  const dirt = new THREE.Color(0xc7ae74), edge = new THREE.Color(0xb39a63);
  const tmp = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let n = Math.sin(x * 0.05) * Math.cos(z * 0.055) + Math.sin((x + z) * 0.021) + 0.4 * Math.sin(x * 0.13 + 2) * Math.sin(z * 0.17);
    tmp.copy(gA).lerp(gB, clamp(n * 0.5 + 0.5, 0, 1));
    if (Math.abs(Math.sin(x * 0.13 + 2.0) * Math.sin(z * 0.17)) > 0.82) tmp.copy(gC);
    const d = pathDist(x, z);
    if (d < 1.6) { const f = clamp(d / 1.6, 0, 1); tmp.lerp(dirt, f * f); }
    else if (d < 2.6) { const f = clamp((d - 1.6) / 1.0, 0, 1); tmp.lerp(edge, 1 - f); }
    if (Math.abs(z - (-14)) < 1.1 && Math.abs(x) < 30 && d > 2.2) {
      const f = clamp(Math.abs(z + 14) / 1.1, 0, 1); tmp.lerp(dirt, f * f);
    }
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  m.receiveShadow = true;
  return m;
}
scene.add(makeGround());

// rolling hills on the horizon so the village sits in a valley, not a void
{
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x5d8a3e, roughness: 1 });
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * TAU + rr(-0.2, 0.2);
    const r = 150 + rr(-8, 30);
    const h = new THREE.Mesh(new THREE.SphereGeometry(rr(34, 60), 20, 12), hillMat);
    h.position.set(Math.cos(a) * r, -6 + rr(-2, 4), Math.sin(a) * r);
    h.scale.y = 0.55;
    scene.add(h);
  }
}

// ============================================================================
// Bag End — the Hill, with the round green door
// ============================================================================
const HILL = new THREE.Vector3(0, -3.5, -44);
const DOOR_N = new THREE.Vector3(0, 0.35, 0.936).normalize();
const DOOR_P = new THREE.Vector3(0, 1.95, -29.9);
const hillRadii = [20, 9.92, 16.8]; // ellipsoid radii x, y, z
function hillPoint(x, y, z, inset = 0.97) {
  const u = new THREE.Vector3(x - HILL.x, y - HILL.y, z - HILL.z).normalize();
  const r = 1 / Math.sqrt((u.x / hillRadii[0]) ** 2 + (u.y / hillRadii[1]) ** 2 + (u.z / hillRadii[2]) ** 2);
  return HILL.clone().addScaledVector(u, r * inset);
}
const windowMats = [];      // every lit window in the village
const lanternMats = [];     // party lanterns
const stringMats = [];      // string lights
const candleFlames = [];    // cake candles
const smokePuffs = [];      // chimney smoke
const hobbits = [];         // all hobbits
const bilboRef = {};

function buildBagEnd() {
  const g = new THREE.Group();
  const hill = new THREE.Mesh(new THREE.SphereGeometry(16, 48, 32), new THREE.MeshStandardMaterial({ color: 0x64943e, roughness: 1 }));
  hill.scale.set(1.25, 0.62, 1.05);
  hill.position.copy(HILL);
  hill.castShadow = true; hill.receiveShadow = true;
  g.add(hill);

  // door in its stone frame
  const dg = new THREE.Group();
  const arch = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, 0.7, 28), new THREE.MeshStandardMaterial({ color: 0x8a7055, roughness: 0.9 }));
  dg.add(arch);
  const door = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.34, 28), new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: 0.7 }));
  door.position.y = 0.16;
  dg.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), new THREE.MeshStandardMaterial({ color: 0xd8b64a, metalness: 0.85, roughness: 0.3 }));
  knob.position.set(-0.85, 0.08, 0.42);
  dg.add(knob);
  dg.position.copy(DOOR_P);
  dg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), DOOR_N);
  g.add(dg);

  // two round windows, one up and one aside — windows, not a face
  const winMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.4, emissive: 0xffd27a, emissiveIntensity: 0 });
  windowMats.push(winMat);
  for (const [x, y, z] of [[2.55, 3.5, -28.6], [-2.85, 2.9, -28.2]]) {
    const p = hillPoint(x, y, z, 1.0);
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.2, 22), winMat);
    w.position.copy(p);
    w.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(p.x - HILL.x, p.y - HILL.y, p.z - HILL.z).normalize());
    g.add(w);
    const fr = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.08, 8, 22), new THREE.MeshStandardMaterial({ color: 0x4a3b2a }));
    fr.position.copy(p);
    fr.quaternion.copy(w.quaternion);
    g.add(fr);
  }

  // chimney + smoke puffs
  const chP = hillPoint(-4.5, 5.0, -46.5, 1.0);
  const chN = new THREE.Vector3(chP.x - HILL.x, chP.y - HILL.y, chP.z - HILL.z).normalize();
  const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.75, 3.2, 12), new THREE.MeshStandardMaterial({ color: 0x8a6f52, roughness: 1 }));
  chimney.position.copy(chP).addScaledVector(chN, 1.2);
  chimney.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), chN);
  g.add(chimney);
  const smokeBase = chP.clone().addScaledVector(chN, 3.0);
  for (let i = 0; i < 16; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(rr(0.5, 1.0), 8, 8), new THREE.MeshBasicMaterial({ color: 0xd8d8d8, transparent: true, opacity: 0.3 }));
    s.userData = { base: smokeBase, off: i / 16, speed: rr(0.35, 0.6), drift: rr(-0.6, 0.6) };
    scene.add(s);
    smokePuffs.push(s);
  }

  // stone landing and two steps under the door, hugging the slope
  const slab = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 0.18, 24), new THREE.MeshStandardMaterial({ color: 0x9a9488, roughness: 1 }));
  slab.position.copy(DOOR_P).addScaledVector(DOOR_N, -1.35);
  slab.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), DOOR_N);
  slab.receiveShadow = true;
  g.add(slab);
  for (let i = 0; i < 2; i++) {
    const st = new THREE.Mesh(new THREE.CylinderGeometry(1.8 - i * 0.25, 1.8 - i * 0.25, 0.14, 24), new THREE.MeshStandardMaterial({ color: 0xa29c8e, roughness: 1 }));
    st.position.copy(DOOR_P).addScaledVector(DOOR_N, -2.15 - i * 0.85);
    st.quaternion.copy(slab.quaternion);
    st.receiveShadow = true;
    g.add(st);
  }

  // flower barrels and a bench beside the door
  for (const sx of [-2.4, 2.6]) {
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.38, 0.6, 10), new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 1 }));
    const bp = DOOR_P.clone().addScaledVector(DOOR_N, -2.3); bp.x += sx; bp.y = 0.35;
    barrel.position.copy(bp);
    g.add(barrel);
    const bush = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8), new THREE.MeshStandardMaterial({ color: pick([0x6a9a3f, 0x8a5a3a, 0xc9a45a]), roughness: 1 }));
    bush.position.copy(bp); bush.position.y += 0.55;
    g.add(bush);
  }

  // low fence curving down from the door along the path
  const postMat = new THREE.MeshStandardMaterial({ color: 0x6b4f30 });
  for (let i = 0; i < 7; i++) {
    const zz = -26 - i * 1.7;
    const pxy = pathXY(zz);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.9, 6), postMat);
    post.position.set(pxy.x + 2.4, 0.45, zz);
    g.add(post);
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.9, 6), postMat);
    rail.rotation.z = Math.PI / 2;
    rail.position.set(pxy.x + 2.4, 0.72, zz);
    g.add(rail);
  }
  return g;
}
scene.add(buildBagEnd());

function makeSmial(x, z, rotY, doorCol) {
  const g = new THREE.Group();
  const mound = new THREE.Mesh(new THREE.SphereGeometry(3.0, 20, 14), new THREE.MeshStandardMaterial({ color: pick([0x64943e, 0x5f8f3c, 0x6d9a42]), roughness: 1 }));
  mound.scale.set(1.15, 0.55, 1.0);
  mound.position.y = 0.4;
  mound.castShadow = true; mound.receiveShadow = true;
  g.add(mound);
  const MC = new THREE.Vector3(0, 0.4, 0);
  const MR = [3.45, 1.65, 3.0];
  const moundPoint = (px, py, pz, inset) => {
    const u = new THREE.Vector3(px, py - MC.y, pz).normalize();
    const r = 1 / Math.sqrt((u.x / MR[0]) ** 2 + (u.y / MR[1]) ** 2 + (u.z / MR[2]) ** 2);
    return { p: MC.clone().addScaledVector(u, r * inset), n: u.clone() };
  };
  // round door on the mound's face
  const dp = moundPoint(0, 1.15, 2.6, 1.02);
  const dg = new THREE.Group();
  const door = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.26, 20), new THREE.MeshStandardMaterial({ color: doorCol, roughness: 0.7 }));
  dg.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: 0xd8b64a, metalness: 0.8, roughness: 0.3 }));
  knob.position.set(-0.55, 0, 0.35);
  dg.add(knob);
  dg.position.copy(dp.p);
  dg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dp.n);
  g.add(dg);
  // one round window, offset up and to the side
  const wm = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, emissive: 0xffc97a, emissiveIntensity: 0, roughness: 0.5 });
  windowMats.push(wm);
  const wp = moundPoint(1.5, 1.8, 1.9, 1.0);
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.16, 16), wm);
  w.position.copy(wp.p);
  w.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), wp.n);
  g.add(w);
  const wf = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.07, 8, 16), new THREE.MeshStandardMaterial({ color: 0x4a3b2a }));
  wf.position.copy(wp.p);
  wf.quaternion.copy(w.quaternion);
  g.add(wf);
  // tiny chimney
  const cp = moundPoint(-1.7, 2.4, -0.8, 1.0);
  const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x8a6f52 }));
  ch.position.copy(cp.p).addScaledVector(cp.n, 0.4);
  ch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cp.n);
  g.add(ch);
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  return g;
}

function makeMill(x, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.5, 4.6, 4.2), new THREE.MeshStandardMaterial({ color: 0xcbb58e, roughness: 1 }));
  body.position.y = 2.3;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.9, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0x7a5c38, roughness: 1 }));
  roof.position.y = 5.7;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  const wm = new THREE.MeshStandardMaterial({ color: 0x33303a, emissive: 0xffc97a, emissiveIntensity: 0 });
  windowMats.push(wm);
  const w = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), wm);
  w.position.set(0, 2.6, 2.12);
  g.add(w);
  // the water wheel
  const wheel = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.16, 8, 22), new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.8 }));
  wheel.add(rim);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU;
    const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 3.3, 6), new THREE.MeshStandardMaterial({ color: 0x5a4030 }));
    spoke.rotation.z = Math.PI / 2;
    spoke.position.set(Math.cos(a) * 1.65, Math.sin(a) * 1.65, 0);
    wheel.add(spoke);
  }
  wheel.position.set(2.45, 2.05, 0);
  g.add(wheel);
  g.position.set(x, 0, z);
  return { g, wheel };
}

function makeTent(x, z, ca, cb) {
  const g = new THREE.Group();
  const cone = new THREE.ConeGeometry(4.6, 3.0, 12);
  const pos = cone.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const A = new THREE.Color(ca), B = new THREE.Color(cb);
  for (let i = 0; i < pos.count; i++) {
    const band = Math.floor((pos.getY(i) / 3.0) * 7) % 2;
    const c = band ? A : B;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  cone.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const roof = new THREE.Mesh(cone, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, side: THREE.DoubleSide }));
  roof.position.y = 3.6;
  g.add(roof);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x6b4f30 });
  for (let i = 0; i < 4; i++) {
    const a = (i * TAU) / 4 + 0.35;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.5, 6), poleMat);
    pole.position.set(Math.cos(a) * 3.6, 1.75, Math.sin(a) * 3.6);
    g.add(pole);
  }
  g.position.set(x, 0, z);
  return g;
}
function makeTable(x, z, rotY, len) {

  top.position.y = 1.1;

  g.add(top);
  for (const lx of [-len / 2 + 0.4, len / 2 - 0.4]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 1.0, 1.2), new THREE.MeshStandardMaterial({ color: 0x6b4f30 }));
    leg.position.set(lx, 0.5, 0);
    g.add(leg);
  }
  for (let i = 0; i < Math.floor(len / 1.4); i++) {
    const px = -len / 2 + 0.9 + i * 1.4;
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.07, 12), new THREE.MeshStandardMaterial({ color: 0xf4efdf, roughness: 0.4 }));
    plate.position.set(px, 1.25, 0.2);
    g.add(plate);

    cup.position.set(px + 0.5, 1.32, 0);
    g.add(cup);
  }
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  return g;
}

function makeHobbit(opts = {}) {

// ============================================================================
// audio — every sound is synthesised in code and driven by film time
// ============================================================================
const AUDIO_EVENTS = [];
{
  // birds through the day, crickets once evening falls
  let t = 1.2;
  while (t < DURATION) {
    if (t < DUSK_A) { AUDIO_EVENTS.push({ t, type: 'bird', f: rr(2100, 3800) }); t += rr(1.6, 5.2); }
    else { AUDIO_EVENTS.push({ t, type: 'cricket', f: rr(3900, 4400) }); t += rr(0.8, 2.6); }
  }
  // rockets and their booms at exact film times
  for (const fw of fireworks) {
    AUDIO_EVENTS.push({ t: fw.t0, type: 'rocket' });
    AUDIO_EVENTS.push({ t: fw.t0 + 1.15, type: 'boom', size: fw.life / 3.4 });
  }
  AUDIO_EVENTS.sort((a, b) => a.t - b.t);
}

function buildEvent(ctx, master, ev, at) {
  const nodes = [];
  const out = master;
  if (ev.type === 'bird') {
    const n = 2 + (RNG() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const t0 = at + i * rr(0.12, 0.3);
      const o = ctx.createOscillator();
      o.type = 'sine';
      const f = ev.f * (1 + i * 0.22);
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f * 1.45, t0 + 0.05);
      o.frequency.exponentialRampToValueAtTime(f * 0.82, t0 + 0.13);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.035, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      o.connect(g); g.connect(out);
      o.start(t0); o.stop(t0 + 0.18);
      nodes.push(o, g);
    }
  } else if (ev.type === 'cricket') {
    for (let i = 0; i < 4; i++) {
      const t0 = at + i * 0.055;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(ev.f, t0);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.016, t0 + 0.006);
      g.gain.linearRampToValueAtTime(0.0001, t0 + 0.03);
      o.connect(g); g.connect(out);
      o.start(t0); o.stop(t0 + 0.035);
      nodes.push(o, g);
    }
  } else if (ev.type === 'rocket') {
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(160, at);
    o.frequency.exponentialRampToValueAtTime(1150, at + 1.15);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.08, at + 0.07);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 1.2);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2200;
    o.connect(lp); lp.connect(g); g.connect(out);
    o.start(at); o.stop(at + 1.25);
    nodes.push(o, g);
  } else if (ev.type === 'boom') {
    const dur = 0.8 + (ev.size || 0.6) * 0.4;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.34 + (ev.size || 0.6) * 0.28, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 460 + (ev.size || 0.6) * 300;
    src.connect(lp); lp.connect(g); g.connect(out);
    src.start(at);
    nodes.push(src, g);
    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(70, at);
    sub.frequency.exponentialRampToValueAtTime(38, at + 0.35);
    const sg = ctx.createGain();
    sg.gain.setValueAtTime(0.16, at);
    sg.gain.exponentialRampToValueAtTime(0.0001, at + 0.4);
    sub.connect(sg); sg.connect(out);
    sub.start(at); sub.stop(at + 0.45);
    nodes.push(sub, sg);
  }
  return nodes;
}

class AudioEngine {
  constructor() {
    this.started = false; this.enabled = true;
    this.ctx = null; this.master = null;
    this.windGain = null; this.crowdGain = null;
    this.pending = []; this.nextEv = 0;
  }
  start() {
    if (!this.started) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = new AC();
      this.started = true;
      this.ctx = c;
      c.resume().catch(() => {});
      const unlock = () => c.state !== 'running' && c.resume().catch(() => {});
      window.addEventListener('pointerdown', unlock);
      window.addEventListener('keydown', unlock);
      this.master = c.createGain();
      this.master.gain.value = this.enabled ? 0.9 : 0;
      this.master.connect(c.destination);
      const len = c.sampleRate * 2;
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      let b = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b = (b + 0.02 * w) / 1.02; d[i] = b * 3.5; }
      const src = c.createBufferSource();
      src.buffer = buf; src.loop = true;
      this.windGain = c.createGain();
      this.windGain.gain.value = 0.03;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.7;
      src.connect(lp); lp.connect(this.windGain); this.windGain.connect(this.master);
      src.start();
      const src2 = c.createBufferSource();
      src2.buffer = buf; src2.loop = true;
      this.crowdGain = c.createGain();
      this.crowdGain.gain.value = 0;
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 850; bp.Q.value = 0.5;
      src2.connect(bp); bp.connect(this.crowdGain); this.crowdGain.connect(this.master);
      src2.start();
    } else if (this.ctx) {
      this.ctx.resume().catch(() => {});
    }
  }
  murmurFor(t) {
    const shot = shotAt(Math.min(t, DURATION - 0.001)).shot;
    const talky = shot.id === 'field' || shot.id === 'dusk' || shot.id === 'talk' || shot.id === 'crowd';
    return (talky ? 0.05 : 0.016) * (0.5 + glow(t) * 0.6);
  }
  update(t) {
    if (!this.ctx) return;
    const ct = this.ctx.currentTime;
    this.windGain.gain.setTargetAtTime(0.028 + 0.02 * Math.sin(t * 0.4) + glow(t) * 0.012, ct, 0.2);
    this.crowdGain.gain.setTargetAtTime(this.murmurFor(t), ct, 0.3);
  }
  sync(t) {
    for (const p of this.pending) {
      if (p.t > t + 0.02) {
        p.dead = true;
        try { p.nodes.forEach((n) => n.stop && n.stop()); } catch (e) { /* already silent */ }
      }
    }
    this.pending = this.pending.filter((p) => !p.dead);
    this.nextEv = 0;
    while (this.nextEv < AUDIO_EVENTS.length && AUDIO_EVENTS[this.nextEv].t <= t) this.nextEv++;
  }
  schedule(t) {
    if (!this.ctx) return;
    const ct = this.ctx.currentTime;
    while (this.nextEv < AUDIO_EVENTS.length && AUDIO_EVENTS[this.nextEv].t < t + 1.2) {
      const ev = AUDIO_EVENTS[this.nextEv++];
      const at = ct + Math.max(0.02, ev.t - t);
      const nodes = buildEvent(this.ctx, this.master, ev, at);
      this.pending.push({ t: ev.t, nodes, dead: false });
    }
  }
  setEnabled(on) {
    this.enabled = on;
    if (this.master) this.master.gain.value = on ? 0.9 : 0;
  }
}
const audio = new AudioEngine();

// offline render of the full sound track (used for the local video copy)
async function renderAudioWav() {
  const sr = 44100;
  const len = Math.ceil(DURATION * sr);
  const oc = new OfflineAudioContext(1, len, sr);
  const master = oc.createGain();
  master.gain.value = 0.9;
  master.connect(oc.destination);
  const nbuf = oc.createBuffer(1, sr * 2, sr);
  const nd = nbuf.getChannelData(0);
  let b = 0;
  for (let i = 0; i < nd.length; i++) { const w = Math.random() * 2 - 1; b = (b + 0.02 * w) / 1.02; nd[i] = b * 3.5; }
  const src = oc.createBufferSource();
  src.buffer = nbuf; src.loop = true;
  const windGain = oc.createGain();
  const lp = oc.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.7;
  src.connect(lp); lp.connect(windGain); windGain.connect(master);
  src.start(0);
  const src2 = oc.createBufferSource();
  src2.buffer = nbuf; src2.loop = true;
  const crowdGain = oc.createGain();
  const bp = oc.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 850; bp.Q.value = 0.5;
  src2.connect(bp); bp.connect(crowdGain); crowdGain.connect(master);
  src2.start(0);
  for (let t = 0; t <= DURATION; t += 0.5) {
    windGain.gain.setValueAtTime(0.028 + 0.02 * Math.sin(t * 0.4) + glow(t) * 0.012, t);
    const shot = shotAt(Math.min(t, DURATION - 0.001)).shot;
    const talky = shot.id === 'field' || shot.id === 'dusk' || shot.id === 'talk' || shot.id === 'crowd';
    crowdGain.gain.setValueAtTime((talky ? 0.05 : 0.016) * (0.5 + glow(t) * 0.6), t);
  }
  for (const ev of AUDIO_EVENTS) buildEvent(oc, master, ev, ev.t);
  const buf = await oc.startRendering();
  const ch = buf.getChannelData(0);
  const n = ch.length;
  const bytes = new Uint8Array(44 + n * 2);
  const dv = new DataView(bytes.buffer);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) bytes[o + i] = s.charCodeAt(i); };
  wstr(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); wstr(8, 'WAVE'); wstr(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  wstr(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, ch[i]));
    dv.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
  }
  let b64 = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) b64 += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CHUNK, bytes.length)));
  return { sr, base64: btoa(b64) };
}

// ============================================================================
// per-frame world update — everything is a function of film time
// ============================================================================
function lookUpBlend(t) {
  const { shot } = shotAt(t);
  if (shot.id !== 'fireworks' && shot.id !== 'finale') return 0;
  const inn = sstep(clamp((t - shot.start) / 1.2, 0, 1));
  const outt = shot.id === 'finale' ? 1 : sstep(clamp((shot.start + shot.dur - t) / 1.0, 0, 1));
  return inn * outt;
}

function updateHobbits(t) {
  const lu = lookUpBlend(t);
  for (const h of hobbits) {
    const u = h.userData, ph = u.phase;
    const [legL, legR] = u.legs;
    const [armL, armR] = u.arms;
    const head = u.head;
    let walk = 0, bob = 0, nod = 0, armRUp = 0;
    const role = u.role;
    if (role === 'bilbo') {
      armR.rotation.x = -0.35 - (0.55 + 0.55 * Math.sin(t * 5.2)) * 0.95;
      armL.rotation.x = 0.12;
      bob = Math.sin(t * 2.1) * 0.02;
      nod = 0.06 * Math.sin(t * 1.4 + ph);
    } else if (role === 'stroll') {
      const rng0 = u.range, span = rng0[1] - rng0[0];
      const prog = ((t * u.speed + u.z0) - rng0[0]) % span;
      const dir = Math.floor(((t * u.speed + u.z0) - rng0[0]) / span) % 2 === 0 ? 1 : -1;
      const z = dir === 1 ? rng0[0] + prog : rng0[1] - prog;
      const pxy = pathXY(z);
      h.position.x = pxy.x + u.side;
      h.position.z = z;
      h.rotation.y = dir === 1 ? pxy.yaw : pxy.yaw + Math.PI;
      walk = t * (3.2 + u.speed * 7) + ph;
      bob = Math.abs(Math.sin(walk)) * 0.05;
      armL.rotation.x = Math.sin(walk) * 0.55;
      armR.rotation.x = -Math.sin(walk) * 0.55;
    } else if (role === 'lanewalk') {
      const rng0 = u.range, span = rng0[1] - rng0[0];
      const prog = ((t * u.speed + u.x0) - rng0[0]) % span;
      const dir = Math.floor(((t * u.speed + u.x0) - rng0[0]) / span) % 2 === 0 ? 1 : -1;
      const x = dir === 1 ? rng0[0] + prog : rng0[1] - prog;
      h.position.x = x;
      h.position.z = -13.0;
      h.rotation.y = dir === 1 ? Math.PI / 2 : -Math.PI / 2;
      walk = t * (3.2 + u.speed * 7) + ph;
      bob = Math.abs(Math.sin(walk)) * 0.05;
      armL.rotation.x = Math.sin(walk) * 0.55;
      armR.rotation.x = -Math.sin(walk) * 0.55;
    } else if (role === 'child') {
      const a = u.cp + t * u.cw;
      h.position.x = Math.cos(a) * u.cr;
      h.position.z = 16 + Math.sin(a) * u.cr * 0.6;
      h.rotation.y = -a + Math.PI / 2;
      h.position.y = Math.abs(Math.sin(t * 9 + u.cp)) * 0.18;
      walk = t * 11 + u.cp;
      armL.rotation.x = -2.2 + Math.sin(walk) * 0.4;
      armR.rotation.x = -2.2 - Math.sin(walk) * 0.4;
    } else if (role === 'gossip') {
      nod = 0.14 * Math.sin(t * 1.8 + ph);
      armRUp = Math.max(0, Math.sin(t * 0.9 + ph)) ** 3 * 0.9;
      armR.rotation.x = -0.3 - armRUp;
      armL.rotation.x = 0.12 - armRUp * 0.4;
      h.rotation.y += Math.sin(t * 0.7 + ph) * 0.008;
    } else if (role === 'worker') {
      armR.rotation.x = -0.5 - 0.3 * Math.sin(t * 2.2 + ph);
      armL.rotation.x = -0.4 - 0.3 * Math.cos(t * 2.2 + ph);
      nod = 0.08 * Math.sin(t * 1.6 + ph);
    } else { // watcher
      h.rotation.y += Math.sin(t * 0.4 + ph) * 0.006;
      nod = 0.05 * Math.sin(t * 0.8 + ph);
      armL.rotation.x = 0.1 * Math.sin(t * 0.5 + ph);
      armR.rotation.x = 0.1 * Math.cos(t * 0.5 + ph);
    }
    if (role !== 'bilbo') {
      const isWalk = role === 'stroll' || role === 'lanewalk' || role === 'child';
      const swing = isWalk ? (role === 'child' ? 0.5 : 0.62) : 0.03;
      const ph2 = isWalk ? walk : t * 0.9 + ph;
      legL.rotation.x = Math.sin(ph2) * swing;
      legR.rotation.x = -Math.sin(ph2) * swing;
    }
    if (role === 'stroll' || role === 'lanewalk') h.position.y = bob;
    else if (role === 'bilbo') h.position.y = (u.baseY || 0) + bob;
    else if (role !== 'child') h.position.y = 0;
    head.rotation.x = lerp(nod, -0.78, lu);
    head.rotation.y = role === 'gossip' ? 0 : 0;
    head.rotation.z = 0;
  }
}

function updateFireworks(t) {
  for (const fw of fireworks) {
    const age = t - fw.t0;
    if (age < -0.2 || age > 1.15 + fw.life + 0.2) { fw.pts.visible = false; continue; }
    fw.pts.visible = true;
    const pos = fw.geo.attributes.position.array;
    if (age > 1.15 && !fw.burstP) { fw.pts.visible = false; continue; }
    if (age <= 1.15) {
      const g = -2.5;
      for (let i = 0; i < 6; i++) {
        const a = age - i * 0.06;
        const aa = Math.max(0.05, a);
        pos[i * 3] = fw.x + fw.vx * aa;
        pos[i * 3 + 1] = fw.y + fw.vy * aa + 0.5 * g * aa * aa;
        pos[i * 3 + 2] = fw.z + fw.vz * aa;
      }
      const bx = fw.x + fw.vx * age, by = fw.y + fw.vy * age + 0.5 * g * age * age, bz = fw.z + fw.vz * age;
      for (let i = 6; i < 96; i++) {
        pos[i * 3] = bx; pos[i * 3 + 1] = by; pos[i * 3 + 2] = bz;
      }
      fw.mat.opacity = 1;
      fw.burstP = [bx, by, bz];
    } else {
      const ae = age - 1.15;
      const bx = fw.burstP[0], by = fw.burstP[1], bz = fw.burstP[2];
      for (let i = 6; i < 96; i++) {
        const j = i - 6;
        pos[i * 3] = bx + fw.dirs[j * 3] * fw.spd[j] * ae;
        pos[i * 3 + 1] = by + fw.dirs[j * 3 + 1] * fw.spd[j] * ae - 1.6 * ae * ae;
        pos[i * 3 + 2] = bz + fw.dirs[j * 3 + 2] * fw.spd[j] * ae;
      }
      for (let i = 0; i < 6; i++) { pos[i * 3] = bx; pos[i * 3 + 1] = by; pos[i * 3 + 2] = bz; }
      fw.mat.opacity = Math.max(0, 1 - ae / fw.life);
    }
    fw.geo.attributes.position.needsUpdate = true;
  }
}

function updateEnv(t) {
  skyColor.copy(skyC(t));
  scene.fog.color.copy(fogC(t));
  sun.color.copy(sunC(t));
  sun.intensity = sunI(t);
  hemi.intensity = hemiI(t);
  moon.intensity = moonI(t);
  stars.material.opacity = starO(t);
  const sa = sunAngle(t);
  sun.position.set(Math.cos(sa) * 190, Math.sin(sa) * 190, 30);
  sunDisc.position.set(Math.cos(sa) * 178, Math.sin(sa) * 178, 28);
  const ma = moonAngle(t);
  moon.position.set(-Math.cos(ma) * 190, Math.sin(ma) * 190, -30);
  moonDisc.position.set(-Math.cos(ma) * 178, Math.sin(ma) * 178, -28);
  const gl = glow(t);
  for (let i = 0; i < windowMats.length; i++) windowMats[i].emissiveIntensity = gl * (0.72 + 0.28 * Math.sin(t * 0.6 + i * 1.7));
  for (const m of lanternMats) m.emissiveIntensity = gl * (0.85 + 0.15 * Math.sin(t * 8.5));
  for (const m of stringMats) m.emissiveIntensity = gl * 0.9;
  for (let i = 0; i < candleFlames.length; i++) {
    const f = candleFlames[i];
    f.position.y = 2.22 + Math.sin(t * 12 + f.position.x * 3.1) * 0.04;
  }
  for (const s of smokePuffs) {
    const u = s.userData;
    const age = ((t * u.speed + u.off) % 1);
    s.position.set(u.base.x + Math.sin((age + u.drift) * 2.1) * 0.6, u.base.y + age * 3.4, u.base.z + Math.cos(age * 2.1) * 0.4);
    s.scale.setScalar(1 + age * 2.1);
    s.material.opacity = 0.3 * (1 - age);
  }
  millRef.wheel.rotation.z = t * 0.45;
}

let lastCaption = null;
function updateScene(t) {
  const { shot, idx, lt } = shotAt(t);
  const sp = sampleShot(shot, lt);
  camera.position.set(sp.p[0], sp.p[1], sp.p[2]);
  camera.lookAt(sp.l[0], sp.l[1], sp.l[2]);
  if (camera.fov !== shot.fov) { camera.fov = shot.fov; camera.updateProjectionMatrix(); }
  updateEnv(t);
  updateHobbits(t);
  updateFireworks(t);
  fadeEl.style.opacity = fadeOf(t).toFixed(3);
  // UI (throttled where possible)
  if (idx !== prevShot) {
    prevShot = idx;
    shotnameEl.textContent = shot.title;
  }
  const cap = (showCap && shot.cap >= 0) ? CAPTIONS[shot.cap] : '';
  if (cap !== lastCaption) {
    lastCaption = cap;
    capEl.textContent = cap;
    if (cap) capEl.classList.add('show');
    else capEl.classList.remove('show');
  }
  fillEl.style.width = (t / DURATION * 100).toFixed(3) + '%';
  if (Math.abs(t - lastTcT) > 0.15) {
    lastTcT = t;
    tcEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  }
}

// ============================================================================
// player state + UI wiring
// ============================================================================
const $ = (id) => document.getElementById(id);
const capEl = $('caption'), fadeEl = $('fade'), titleEl = $('title');
const bPlay = $('bPlay'), bPrev = $('bPrev'), bNext = $('bNext'), bCap = $('bCap'), bSound = $('bSound'), bFull = $('bFull');
const fillEl = $('fill'), marksEl = $('marks'), tcEl = $('tc'), shotnameEl = $('shotname'), scrubEl = $('scrub');

let playing = false, showCap = true, hideUI = false, prevShot = -1, lastTcT = -9;
let time = 0;

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
for (const s of SHOTS) {
  const m = document.createElement('i');
  m.style.left = (s.start / DURATION * 100) + '%';
  marksEl.appendChild(m);
}
function seek(t) {
  time = clamp(t, 0, DURATION - 0.001);
  audio.sync(time);
  updateScene(time);
  renderer.render(scene, camera);
}
function togglePlay() {
  if (time >= DURATION - 0.05) seek(0);
  playing = !playing;
  bPlay.textContent = playing ? 'Pause' : 'Play';
  if (playing) audio.start();
}
bPlay.onclick = togglePlay;
bPrev.onclick = () => { const { idx } = shotAt(time); seek(SHOTS[Math.max(0, idx - 1)].start); };
bNext.onclick = () => { const { idx } = shotAt(time); seek(SHOTS[Math.min(SHOTS.length - 1, idx + 1)].start); };
bCap.onclick = () => {
  showCap = !showCap;
  bCap.classList.toggle('on', showCap);
  document.body.classList.toggle('nocap', !showCap);
  lastCaption = null;
  updateScene(time);
};
bSound.onclick = () => {
  audio.setEnabled(!audio.enabled);
  bSound.classList.toggle('on', audio.enabled);
};
bFull.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
scrubEl.addEventListener('pointerdown', (e) => {
  const r = scrubEl.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * DURATION);
  const move = (ev) => { const rr2 = scrubEl.getBoundingClientRect(); seek((ev.clientX - rr2.left) / rr2.width * DURATION); };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!document.body.classList.contains('titlemode')) togglePlay(); }
  else if (e.key === '[') bPrev.onclick();
  else if (e.key === ']') bNext.onclick();
  else if (e.key === 'c') bCap.onclick();
  else if (e.key === 'm') bSound.onclick();
  else if (e.key === 'f') bFull.onclick();
});
let uiTimer;
function showUI() {
  $('ui').classList.add('show');
  document.body.classList.remove('hideui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => { if (playing) { $('ui').classList.remove('show'); document.body.classList.add('hideui'); } }, 2400);
}
window.addEventListener('pointermove', showUI);

const playBtn = $('play');
function start() {
  titleEl.classList.add('gone');
  document.body.classList.remove('titlemode');
  $('ui').classList.add('show');
  playing = true;
  bPlay.textContent = 'Pause';
  audio.start();
  audio.sync(time);
}
playBtn.onclick = start;

// deep links
const q = new URLSearchParams(location.search);
const qT = parseFloat(q.get('t'));
if (!isNaN(qT)) time = clamp(qT, 0, DURATION - 0.001);

// ============================================================================
// main loop — wall-clock only drives time forward when playing
// ============================================================================
let lastT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  if (RECORD) return; // recording is driven frame-by-frame from outside
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (playing) {
    time = Math.min(time + dt, DURATION);
    if (time >= DURATION) { time = DURATION; playing = false; bPlay.textContent = 'Play'; }
    audio.update(time);
    audio.schedule(time);
    updateScene(time);
  }
  renderer.render(scene, camera);
}

// ============================================================================
// boot
// ============================================================================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (RECORD) {
  document.body.classList.remove('titlemode');
  document.body.classList.add('recordmode');
  titleEl.remove();
  playing = true; // so the transport/captions update during capture
  seek(0);
} else {
  seek(time);
  playBtn.disabled = false;
  playBtn.textContent = q.get('autoplay') !== null ? 'Loading' : 'Play';
  if (q.get('autoplay') !== null) setTimeout(start, 400);
}
requestAnimationFrame(animate);

// public API used by the offline recorder (and handy for debugging)
window.FILM = {
  ready: false,
  duration: DURATION,
  seek(t) { seek(t); },
  renderNow() { renderer.render(scene, camera); },
  probe() {
    const gl = renderer.getContext();
    const px = new Uint8Array(4);
    gl.readPixels(Math.floor(gl.drawingBufferWidth / 2), Math.floor(gl.drawingBufferHeight / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return Array.from(px);
  },
  renderAudioWav,
  qa() {
    return {
      cam: [camera.position.x, camera.position.y, camera.position.z],
      fov: camera.fov,
      hobbits: hobbits.length,
      fwVisible: fireworks.filter((f) => f.pts.visible).length,
      bilbo: [bilboRef.h.position.x, bilboRef.h.position.y, bilboRef.h.position.z],
      glow: glow(time),
      shot: shotAt(time).shot.id,
      caption: capEl.textContent,
    };
  },
};
window.FILM.ready = true;
</script>
</body>
</html>
