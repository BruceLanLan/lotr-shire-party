    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {

  let y = Math.exp(-(hd * hd) / 240) * 13.6;

function makeGround() {
  const geo = new THREE.PlaneGeometry(340, 340, 140, 140);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const gA = new THREE.Color(0x5a8a38), gB = new THREE.Color(0x7aaa4a), gC = new THREE.Color(0x8aaa50);
  const pathC = new THREE.Color(0xcbb58a), bank = new THREE.Color(0x6e8f44);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = heightAt(x, z);
    pos.setY(i, y);
    const n = Math.sin(x * 0.11) * Math.cos(z * 0.13);
    tmp.copy(gA).lerp(gB, clamp(n * 0.5 + 0.5, 0, 1));
    if (Math.abs(Math.sin(x * 0.17 + 1.2) * Math.sin(z * 0.14)) > 0.82) tmp.copy(gC);
    const pd = Math.hypot(x - 24, z - 4);

    if (Math.abs(x) < 2.15 && z > -42 && z < 24) tmp.copy(pathC);
    const hd = Math.hypot(x, z + 50);
    if (hd < 16) tmp.lerp(new THREE.Color(0x4e7c32), 0.45);

}

function stripeTex(a, b) {
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 128;
  const ctx = cv.getContext('2d');
  for (let y = 0; y < 128; y += 16) {
    ctx.fillStyle = (y / 16) % 2 ? a : b;
    ctx.fillRect(0, y, 8, 16);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 2);
  return tex;
}
function makeMarquee(x, z, c0, c1) {

  const roof = new THREE.Mesh(new THREE.ConeGeometry(4.4, 2.5, 12, 1, true), mat);

  }
  g.position.set(x, heightAt(x, z), z);
  return g;
}

function spawnFirework(kind) {
  const origin = new THREE.Vector3(rr(-16, 16), rr(26, 40), rr(-58, -30));
  const N = kind === 'dragon' ? 140 : 86;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const palette = kind === 'dragon'
    ? [0xffd36a, 0xff6a3a]
    : pick([[0xffc96a, 0xff9a5a], [0x8ac8ff, 0x5a8aff], [0xca8aff, 0xff6ac8], [0x8affaa, 0xc8ff5a], [0xffd8a0, 0xff6a6a]]);
  const mat = new THREE.PointsMaterial({
    size: kind === 'dragon' ? 0.7 : 0.52, vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const pts = new THREE.Points(geo, mat);
  const fw = {
    pts, kind: kind || 'burst', age: 0, explode: false, maxLife: rr(2.3, 3.5),
    vel: new Float32Array(N * 3), explodeVels: new Float32Array(N * 3),
  };
  const cc0 = new THREE.Color(palette[0]), cc1 = new THREE.Color(palette[1]);
  for (let i = 0; i < N; i++) {
    fw.vel[i * 3] = rr(-0.5, 0.5);
    fw.vel[i * 3 + 1] = rr(8.5, 13.5);
    fw.vel[i * 3 + 2] = rr(-0.5, 0.5);
    const t = rng();
    const cc = cc0.clone().lerp(cc1, t);
    col[i * 3] = cc.r; col[i * 3 + 1] = cc.g; col[i * 3 + 2] = cc.b;
    if (kind === 'dragon') {
      const u = i / N;
      const th = u * TAU * 1.6;
      const sp = 4 + u * 7;
      fw.explodeVels[i * 3] = Math.cos(th) * sp;
      fw.explodeVels[i * 3 + 1] = Math.sin(th * 2) * sp * 0.45 + (0.5 - u) * 6;
      fw.explodeVels[i * 3 + 2] = Math.sin(th) * sp * 0.7;
    } else {
      const th = rr(0, TAU), ph = Math.acos(rr(-1, 1)), sp = rr(3, 11);
      fw.explodeVels[i * 3] = sp * Math.sin(ph) * Math.cos(th);
      fw.explodeVels[i * 3 + 1] = sp * Math.cos(ph);
      fw.explodeVels[i * 3 + 2] = sp * Math.sin(ph) * Math.sin(th);
    }
  }
  pts.position.copy(origin);
  scene.add(pts);
  fireworks.push(fw);
}
function updateFireworks(dt) {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.age += dt;
    const pos = fw.pts.geometry.attributes.position.array;
    if (!fw.explode) {
      for (let j = 0; j < pos.length / 3; j++) {
        pos[j * 3] += fw.vel[j * 3] * dt;
        pos[j * 3 + 1] += fw.vel[j * 3 + 1] * dt;
        pos[j * 3 + 2] += fw.vel[j * 3 + 2] * dt;
        fw.vel[j * 3 + 1] -= 2.4 * dt;
      }
      if (fw.age > (fw.kind === 'dragon' ? 1.45 : 1.12)) {
        fw.explode = true; fw.life = 0; audio.boom(0, fw.kind === 'dragon' ? 1 : 0.6);
      }
    } else {
      fw.life += dt;
      for (let j = 0; j < pos.length / 3; j++) {
        pos[j * 3] += fw.explodeVels[j * 3] * dt;
        pos[j * 3 + 1] += fw.explodeVels[j * 3 + 1] * dt;
        pos[j * 3 + 2] += fw.explodeVels[j * 3 + 2] * dt;
        fw.explodeVels[j * 3 + 1] -= 3.1 * dt;
      }
      fw.pts.material.opacity = Math.max(0, 1 - fw.life / fw.maxLife);
      if (fw.life > fw.maxLife) {
        scene.remove(fw.pts);
        fw.pts.geometry.dispose();
        fw.pts.material.dispose();
        fireworks.splice(i, 1);
      }
    }
    fw.pts.geometry.attributes.position.needsUpdate = true;
  }
}

// ---------------------------------------------------------------------------
// shots
// ---------------------------------------------------------------------------
const SHOTS = [
  {
    id: 'shire', title: 'The Shire', dur: 14,
    caption: 'When Mr.&nbsp;Bilbo Baggins of Bag&nbsp;End announced that he would shortly be celebrating his eleventy-first birthday&hellip;',
    keys: [
      { p: [-42, 16, 58], l: [2, 6, -18] },
      { p: [-26, 12, 38], l: [0, 7, -28] },
    ],
  },
  {
    id: 'door', title: 'The Round Door', dur: 12,
    caption: '&hellip;with a party of special magnificence&hellip;',
    keys: [
      { p: [2.4, heightAt(0, -24) + 6.2, -20], l: [0, heightAt(0, -37) + 2.2, -37] },
      { p: [0.6, heightAt(0, -30) + 3.6, -28], l: [0, heightAt(0, -37) + 1.6, -37] },
    ],
  },
  {
    id: 'path', title: 'Down to Hobbiton', dur: 10,
    caption: 'There was much talk and excitement in Hobbiton.',
    keys: [
      { p: [6, 7.5, -18], l: [0, 2.4, 4] },
      { p: [4, 5.2, 2], l: [2, 2.2, 20] },
    ],
  },
  {
    id: 'field', title: 'The Party Field', dur: 14,
    caption: 'Tents and tables were raised in the field by the great tree.',
    keys: [
      { p: [-28, 9.5, 36], l: [-4, 3, 22] },
      { p: [-4, 6.2, 40], l: [4, 2.8, 22] },
      { p: [14, 5.4, 36], l: [8, 2.6, 20] },
    ],
  },
  {
    id: 'talk', title: 'Much Talk', dur: 12,
    caption: '&hellip;and there was much talk and excitement in Hobbiton.',
    keys: [
      { p: [-10, 4.2, 26], l: [-2, 1.4, 20] },
      { p: [2, 4.6, 24], l: [8, 1.3, 19] },
    ],
  },
  {
    id: 'lanterns', title: 'Lanternlight', dur: 12,
    caption: 'Lanterns were lit one by one as evening fell.',
    keys: [
      { p: [18, 3.4, 30], l: [2, 4.2, 16] },
      { p: [16, 11, 42], l: [0, 5, -6] },
    ],
  },
  {
    id: 'fireworks', title: 'Fireworks over the Hill', dur: 16,
    caption: 'Then the sky above the Hill began to bloom.',
    keys: [
      { p: [-6, 7.2, 38], l: [0, 22, -40] },
      { p: [0, 8.4, 32], l: [0, 32, -48] },
    ],
  },
  {
    id: 'finale', title: 'A Long-expected Party', dur: 14,
    caption: 'It was a party long remembered in Hobbiton.',
    keys: [
      { p: [0, 12, 46], l: [0, 6, -10] },
      { p: [0, 24, 72], l: [0, 5, -16] },
      { p: [0, 34, 98], l: [0, 4, -18] },
    ],
  },
];
let acc = 0;
for (const s of SHOTS) { s.start = acc; acc += s.dur; }
const DURATION = acc;

function shotAt(t) {
  const tt = clamp(t, 0, DURATION - 0.001);
  for (let i = SHOTS.length - 1; i >= 0; i--) if (tt >= SHOTS[i].start) {
    return { shot: SHOTS[i], idx: i, lt: (tt - SHOTS[i].start) / SHOTS[i].dur };
  }
  return { shot: SHOTS[0], idx: 0, lt: 0 };
}
function sampleShot(shot, lt) {
  const keys = shot.keys;
  if (keys.length === 1) return keys[0];
  const f = clamp(lt, 0, 1) * (keys.length - 1);
  const i = Math.min(Math.floor(f), keys.length - 2);
  const u = smooth(frac(f));
  const a = keys[i], b = keys[i + 1];
  return {
    p: [lerp(a.p[0], b.p[0], u), lerp(a.p[1], b.p[1], u), lerp(a.p[2], b.p[2], u)],
    l: [lerp(a.l[0], b.l[0], u), lerp(a.l[1], b.l[1], u), lerp(a.l[2], b.l[2], u)],
  };
}

// ---------------------------------------------------------------------------
// player
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const capEl = $('caption'), fadeEl = $('fade'), titleEl = $('title');
const bPlay = $('bPlay'), bPrev = $('bPrev'), bNext = $('bNext');
const bCap = $('bCap'), bSound = $('bSound'), bFull = $('bFull');
const fillEl = $('fill'), marksEl = $('marks'), tcEl = $('tc'), shotnameEl = $('shotname'), scrubEl = $('scrub');

let playing = false, showCap = true, lastCaption = null;
let time = 0, prevShot = -1, fireworkBudget = 0, dragonDone = false;

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
for (const s of SHOTS) {
  const m = document.createElement('i');
  m.style.left = (s.start / DURATION * 100) + '%';
  marksEl.appendChild(m);
}
function setCaption(html) {
  if (html !== lastCaption) {
    lastCaption = html;
    capEl.innerHTML = html;
    capEl.classList.toggle('show', !!html);
  }
}
function updateUI() {
  fillEl.style.width = (time / DURATION * 100) + '%';
  tcEl.textContent = `${fmt(time)} / ${fmt(DURATION)}`;
  const { shot, idx } = shotAt(time);
  if (idx !== prevShot) { prevShot = idx; shotnameEl.textContent = shot.title; }
  setCaption(showCap ? shot.caption : '');
}
function seek(t) {
  time = clamp(t, 0, DURATION - 0.001);
  if (time < 70) dragonDone = false;
  updateUI();
}
function togglePlay() {
  if (time >= DURATION - 0.05) seek(0);
  playing = !playing;
  bPlay.textContent = playing ? 'Pause' : 'Play';
  if (playing) audio.start();
}
bPlay.onclick = togglePlay;
bPrev.onclick = () => { const { idx } = shotAt(time); seek(SHOTS[Math.max(0, idx - 1)].start); };
bNext.onclick = () => { const { idx } = shotAt(time); seek(SHOTS[Math.min(SHOTS.length - 1, idx + 1)].start); };
bCap.onclick = () => {
  showCap = !showCap; bCap.classList.toggle('on', showCap);
  document.body.classList.toggle('nocap', !showCap);
  if (!showCap) setCaption('');
};
bSound.onclick = () => {
  audio.enabled = !audio.enabled; bSound.classList.toggle('on', audio.enabled); audio.setSound(audio.enabled);
};
bFull.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
scrubEl.addEventListener('pointerdown', (e) => {
  const r = scrubEl.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * DURATION);
  const move = (ev) => {
    const rr2 = scrubEl.getBoundingClientRect();
    seek((ev.clientX - rr2.left) / rr2.width * DURATION);
  };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (titleEl.classList.contains('gone')) togglePlay(); }
  else if (e.key === '[') bPrev.onclick();
  else if (e.key === ']') bNext.onclick();
  else if (e.key === 'c') bCap.onclick();
  else if (e.key === 'm') bSound.onclick();
  else if (e.key === 'f') bFull.onclick();
});
let uiTimer;
function showUI() {
  $('ui').classList.add('show');
  document.body.classList.remove('hideui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => { if (playing) { $('ui').classList.remove('show'); document.body.classList.add('hideui'); } }, 2400);
}
window.addEventListener('pointermove', showUI);
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const playBtn = $('play');
function start() {
  titleEl.classList.add('gone');
  document.body.classList.remove('titlemode');
  $('ui').classList.add('show');
  playing = true;
  bPlay.textContent = 'Pause';
  audio.start();
}
playBtn.onclick = start;

const q = new URLSearchParams(location.search);
const qT = parseFloat(q.get('t'));
if (!isNaN(qT)) time = clamp(qT, 0, DURATION - 0.001);

// ---------------------------------------------------------------------------
// loop
// ---------------------------------------------------------------------------
let lastT = performance.now();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const sunDir = new THREE.Vector3();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (playing) {
    time += dt;
    if (time >= DURATION) { time = DURATION - 0.001; playing = false; bPlay.textContent = 'Play'; }
    updateUI();
  }

  const { shot, lt } = shotAt(time);
  const sp = sampleShot(shot, lt);
  camPos.set(sp.p[0], sp.p[1], sp.p[2]);
  camLook.set(sp.l[0], sp.l[1], sp.l[2]);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  const edge = lt < 0.07 ? 1 - lt / 0.07 : (lt > 0.93 ? (lt - 0.93) / 0.07 : 0);
  fadeEl.style.opacity = String(edge * 0.92);

  skyU.top.value.copy(skyTop(time));
  skyU.mid.value.copy(skyMid(time));
  skyU.bot.value.copy(skyBot(time));
  scene.fog.color.copy(fogC(time));
  sun.color.copy(sunCol(time));
  sun.intensity = sunI(time);
  hemi.intensity = hemiI(time);
  moon.intensity = moonI(time);
  stars.material.opacity = starO(time);
  const glow = nightG(time);
  partyFill.intensity = glow * 3.4;
  skyU.sunCol.value.copy(sun.color);

  const ang = lerp(1.05, 3.35, clamp(time / DURATION, 0, 1));
  sun.position.set(Math.cos(ang) * 90, Math.max(4, Math.sin(ang) * 70), 28);
  sun.target.position.set(0, 0, -10);
  sunDir.copy(sun.position).normalize();
  skyU.sunDir.value.copy(sunDir);

  for (const m of windowMats) m.emissiveIntensity = glow * (0.75 + 0.25 * Math.sin(time * 0.7 + 1));
  for (const m of lanternMats) m.emissiveIntensity = glow;
  for (const m of stringMats) m.emissiveIntensity = glow * 0.92;
  for (const f of candleFlames) f.scale.setScalar(0.85 + 0.25 * Math.sin(time * 14 + f.position.x * 8));

  for (const s of smokePuffs) {
    const u = s.userData;
    u.age += dt * u.speed;
    if (u.age > 1) u.age -= 1;
    s.position.set(u.base.x + Math.sin((u.age + u.drift) * 2) * 0.55, u.base.y + u.age * 3.4, u.base.z + Math.cos(u.age * 1.8) * 0.35);
    s.scale.setScalar(1 + u.age * 2.1);
    s.material.opacity = 0.28 * (1 - u.age);
  }

  if (waterMesh.geo) {
    const pos = waterMesh.geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i, Math.sin(x * 0.55 + time * 1.4) * 0.07 + Math.cos(z * 0.7 + time * 1.1) * 0.05);
    }
    pos.needsUpdate = true;
    waterMesh.geo.computeVertexNormals();
  }
  for (const w of millWheels) w.rotation.z -= dt * 0.7;

  for (const h of hobbits) {
    const role = h.userData.role, ph = h.userData.phase;
    if (role === 'bilbo') {
      if (h.userData.armR) h.userData.armR.rotation.z = -0.4 - Math.abs(Math.sin(time * 3.8)) * 1.55;
      h.position.y = h.userData.baseY + Math.sin(time * 2) * 0.025;
    } else if (role === 'crowd') {
      h.rotation.y += Math.sin(time * 0.75 + ph) * 0.004;
      h.userData.head.rotation.y = Math.sin(time * 1.25 + ph) * 0.38;
      h.position.y = h.userData.baseY + Math.abs(Math.sin(time * 1.6 + ph)) * 0.02;
    } else if (role === 'stroll') {
      h.position.z += Math.sin(time * 0.45 + ph) * dt * h.userData.speed;
      h.position.y = heightAt(h.position.x, h.position.z);
      h.rotation.y += Math.sin(time * 0.28 + ph) * 0.01;
    } else if (role === 'child') {
      const ang2 = ph + time * h.userData.circleSpeed;
      h.position.x = Math.cos(ang2) * h.userData.circleR;
      h.position.z = 24 + Math.sin(ang2) * h.userData.circleR;
      h.position.y = heightAt(h.position.x, h.position.z) + Math.abs(Math.sin(time * 9 + ph)) * 0.28;
      h.rotation.y = -ang2 + Math.PI / 2;
    } else if (role === 'dance') {
      h.rotation.y += dt * 1.1;
      h.position.y = h.userData.baseY + Math.abs(Math.sin(time * 5 + ph)) * 0.18;
    } else {
      h.rotation.y += Math.sin(time * 0.45 + ph) * 0.004;
    }
    if (shot.id === 'fireworks' || shot.id === 'finale') {
      h.userData.head.rotation.x = -0.65;
      h.userData.head.rotation.y = 0;
    } else {
      h.userData.head.rotation.x = Math.sin(time * 0.55 + ph) * 0.05;
    }
  }

  if (audio.crowdGain) {
    const murmur = (shot.id === 'talk' || shot.id === 'field' || shot.id === 'path') ? 0.1 : 0.045;
    audio.crowdGain.gain.value = audio.enabled ? murmur * (0.75 + glow * 1.3) : 0;
    if (audio.windGain) audio.windGain.gain.value = audio.enabled ? 0.11 + glow * 0.04 : 0;
    if (audio.padGain) audio.padGain.gain.value = audio.enabled ? 0.05 + glow * 0.015 : 0;
  }

  if (shot.id === 'fireworks' || shot.id === 'finale') {
    fireworkBudget += dt * (shot.id === 'fireworks' ? 0.85 : 1.25);
    while (fireworkBudget >= 1) {
      fireworkBudget -= 1;
      const kind = (!dragonDone && shot.id === 'finale') ? 'dragon' : 'burst';
      if (kind === 'dragon') dragonDone = true;
      spawnFirework(kind);
      audio.rocket();
    }
  }
  updateFireworks(dt);
  renderer.render(scene, camera);
}

seek(time);
playBtn.disabled = false;
playBtn.textContent = q.get('autoplay') !== null ? 'Loading' : 'Play';
requestAnimationFrame(animate);
if (q.get('autoplay') !== null) setTimeout(start, 350);
</script>
